# Container group template for aci-theyard-ss (ADR-009).
# The Deploy workflow replaces __IMAGE__ with the freshly pushed tag and runs
# az container create -g RG-THEYARD-SS -f <rendered file>. Sourced from the
# v11 export with the three families az rejects already removed
# (provisioningTimeoutInSeconds, isCustomProvisioningTimeout, the fixed ip).
# No secrets by construction: the registry pull rides the user-assigned identity.
additional_properties: {}
apiVersion: 2024-05-01-preview
extended_location: null
identity:
  type: UserAssigned
  user_assigned_identities:
    ? /subscriptions/df3b718c-6d99-4904-8102-6f865941f640/resourceGroups/RG-THEYARD-SS/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-theyard-ss
    : {}
location: westus2
name: aci-theyard-ss
properties:
  # #region container
  # The image line is a placeholder the pipeline rewrites per roll; everything
  # else is the shape of the container group. This file is the rollback path
  # too: `az container create -f` with it restores a known-good group.
  containers:
  - name: theyard
    properties:
      configMap:
        keyValuePairs: {}
      environmentVariables: []
      image: __IMAGE__
      ports:
      - port: 8080
      resources:
        requests:
          cpu: 1.0
          memoryInGB: 1.5
  # #endregion container
  imageRegistryCredentials:
  - identity: /subscriptions/df3b718c-6d99-4904-8102-6f865941f640/resourceGroups/RG-THEYARD-SS/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-theyard-ss
    isDelegatedIdentity: false
    server: crtheyardsszmnetj67bn5h2.azurecr.io
  initContainers: []
  ipAddress:
    autoGeneratedDomainNameLabelScope: Unsecure
    dnsNameLabel: theyard-ss-zmnetj67bn5h2
    fqdn: theyard-ss-zmnetj67bn5h2.westus2.azurecontainer.io
    ports:
    - port: 8080
      protocol: TCP
    type: Public
  isCreatedFromStandbyPool: false
  osType: Linux
  restartPolicy: Always
  sku: Standard
tags: null
type: Microsoft.ContainerInstance/containerGroups
