# Container group template for aci-theyard-ss (ADR-009).
# The Deploy workflow replaces __IMAGE__ with the freshly pushed tag and runs
# az container create -g RG-THEYARD-SS -f <rendered file>. Sourced from the
# v11 export with the three families az rejects already removed
# (provisioningTimeoutInSeconds, isCustomProvisioningTimeout, the fixed ip).
# No secrets by construction: the registry pull rides the user-assigned identity.
additional_properties: {}
apiVersion: 2024-05-01-preview
extended_location: null
identity:
  type: UserAssigned
  user_assigned_identities:
    ? /subscriptions/df3b718c-6d99-4904-8102-6f865941f640/resourceGroups/RG-THEYARD-SS/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-theyard-ss
    : {}
location: westus2
name: aci-theyard-ss
properties:
  # #region container
  # The image line is a placeholder the pipeline rewrites per roll; everything
  # else is the shape of the container group. This file is the rollback path
  # too: `az container create -f` with it restores a known-good group.
  containers:
  - name: theyard
    properties:
      configMap:
        keyValuePairs: {}
      environmentVariables:
      # Filled in at roll time by the deploy workflow, which reads the value
      # from Azure with the credential it already has (ADR-024). The literal
      # placeholder below is what a manual rollback would set, and the app
      # treats anything starting with __ as "no telemetry", so a rollback runs
      # clean rather than sending to nowhere.
      - name: APPLICATIONINSIGHTS_CONNECTION_STRING
        secureValue: __APPINSIGHTS_CONNECTION_STRING__
      # Azure SQL Database, substituted the same way (ADR: The SQL Server
      # backend). What lands here is a server, a database and
      # `Authentication=Active Directory Managed Identity`: no password, because
      # the server has no SQL login to have one. It is still written as a
      # secureValue, because the setting is where a secret would go if the
      # authentication model ever changed, and a placeholder left behind by a
      # failed substitution means the container falls back to SQLite rather than
      # crash-looping.
      - name: ConnectionStrings__YardSql
        secureValue: __YARD_SQL_CONNECTION__
      # Azure Cosmos DB, beside the SQL setting rather than instead of it: this
      # container runs both stores and a visitor picks one with the toggle at
      # the top of the page (ADR: One container, both stores). An endpoint is a
      # URL, the database is a name, and the credential is the container's own
      # managed identity, so all three are plain values: there is no key on the
      # account to have leaked. The default names the store a request gets when
      # it names none, which on the live site is the relational one.
      - name: Cosmos__AccountEndpoint
        value: https://cosmos-theyard-ss.documents.azure.com:443/
      - name: Cosmos__Database
        value: theyard
      - name: Cosmos__Credential
        value: managed-identity
      - name: Store__Default
        value: sql
      # Warm the other store right after the default one is serving, so the
      # first visitor to toggle does not pay for its catalogue. Off outside a
      # deploy, where ten test applications at once would each warm two.
      - name: Store__WarmOthers
        value: "true"
      # The other container, for the Admin tab's comparison card (ADR: Backends,
      # side by side). A public origin, read server side with a short patience,
      # and a plain value because a URL is not a secret.
      - name: Peer__Url
        value: http://theyard-cosmos-ss-zmnetj67bn5h2.westus2.azurecontainer.io:8080
      image: __IMAGE__
      ports:
      - port: 8080
      resources:
        requests:
          cpu: 1.0
          memoryInGB: 1.5
  # #endregion container
  imageRegistryCredentials:
  - identity: /subscriptions/df3b718c-6d99-4904-8102-6f865941f640/resourceGroups/RG-THEYARD-SS/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-theyard-ss
    isDelegatedIdentity: false
    server: crtheyardsszmnetj67bn5h2.azurecr.io
  initContainers: []
  ipAddress:
    autoGeneratedDomainNameLabelScope: Unsecure
    dnsNameLabel: theyard-ss-zmnetj67bn5h2
    fqdn: theyard-ss-zmnetj67bn5h2.westus2.azurecontainer.io
    ports:
    - port: 8080
      protocol: TCP
    type: Public
  isCreatedFromStandbyPool: false
  osType: Linux
  restartPolicy: Always
  sku: Standard
tags: null
type: Microsoft.ContainerInstance/containerGroups
