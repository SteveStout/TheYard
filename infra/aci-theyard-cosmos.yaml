# Container group template for aci-theyard-cosmos-ss, the second container
# (ADR: A second store on Cosmos DB, and what it costs). The same image, the
# same region, the same 1 CPU and 1.5 GB as aci-theyard.yaml, because the same
# hardware is what makes the comparison honest, and a different store: the
# Cosmos DB settings stand where the SQL connection string stands in the other
# file. The Deploy Cosmos workflow rewrites __IMAGE__ to the tag the Deploy
# workflow just pushed and rolls this group on its own, so a roll of one never
# touches the other. No secrets by construction: the registry pull and the
# store both ride the user-assigned identity, and the account has no keys.
additional_properties: {}
apiVersion: 2024-05-01-preview
extended_location: null
identity:
  type: UserAssigned
  user_assigned_identities:
    ? /subscriptions/df3b718c-6d99-4904-8102-6f865941f640/resourceGroups/RG-THEYARD-SS/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-theyard-ss
    : {}
location: westus2
name: aci-theyard-cosmos-ss
properties:
  # #region container
  # The image line is a placeholder the pipeline rewrites per roll; everything
  # else is the shape of the container group. This file is the rollback path
  # too: `az container create -f` with it restores a known-good group.
  containers:
  - name: theyard
    properties:
      configMap:
        keyValuePairs: {}
      environmentVariables:
      # Filled in at roll time by the deploy workflow, which reads the value
      # from Azure with the credential it already has (ADR-024). The literal
      # placeholder below is what a manual rollback would set, and the app
      # treats anything starting with __ as "no telemetry", so a rollback runs
      # clean rather than sending to nowhere.
      - name: APPLICATIONINSIGHTS_CONNECTION_STRING
        secureValue: __APPINSIGHTS_CONNECTION_STRING__
      # Azure Cosmos DB, in place of the SQL connection string. An account
      # endpoint is a URL, the database is a name, and the credential is the
      # container's own managed identity, so all three are plain values: there
      # is no key on the account to have leaked. No SQL setting at all, so
      # YardConnection.Choose sees the endpoint first and never looks further
      # (ADR: A second store on Cosmos DB, and what it costs).
      - name: Cosmos__AccountEndpoint
        value: https://cosmos-theyard-ss.documents.azure.com:443/
      - name: Cosmos__Database
        value: theyard
      - name: Cosmos__Credential
        value: managed-identity
      # This group's own ARM path, so the Admin tab's "Azure's view of the
      # container" card reads this container and not the other one. An
      # identifier, not a secret (ADR-010).
      - name: Azure__SelfResourceId
        value: /subscriptions/df3b718c-6d99-4904-8102-6f865941f640/resourceGroups/RG-THEYARD-SS/providers/Microsoft.ContainerInstance/containerGroups/aci-theyard-cosmos-ss
      # The other container, for the Admin tab's comparison card (ADR: Backends,
      # side by side). The live site's origin, read server side.
      - name: Peer__Url
        value: http://theyard-ss-zmnetj67bn5h2.westus2.azurecontainer.io:8080
      image: __IMAGE__
      ports:
      - port: 8080
      resources:
        requests:
          cpu: 1.0
          memoryInGB: 1.5
  # #endregion container
  imageRegistryCredentials:
  - identity: /subscriptions/df3b718c-6d99-4904-8102-6f865941f640/resourceGroups/RG-THEYARD-SS/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-theyard-ss
    isDelegatedIdentity: false
    server: crtheyardsszmnetj67bn5h2.azurecr.io
  initContainers: []
  ipAddress:
    autoGeneratedDomainNameLabelScope: Unsecure
    dnsNameLabel: theyard-cosmos-ss-zmnetj67bn5h2
    fqdn: theyard-cosmos-ss-zmnetj67bn5h2.westus2.azurecontainer.io
    ports:
    - port: 8080
      protocol: TCP
    type: Public
  isCreatedFromStandbyPool: false
  osType: Linux
  restartPolicy: Always
  sku: Standard
tags: null
type: Microsoft.ContainerInstance/containerGroups
