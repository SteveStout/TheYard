<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="TheYard, a used-vehicle auction platform, by Steven Stout">
  <rect width="1200" height="630" fill="#e9e6e7"/>
  <rect x="56" y="56" width="1088" height="518" rx="24" fill="#ffffff"/>
  <rect x="56" y="56" width="1088" height="10" rx="5" fill="#536786"/>

  <g transform="translate(112, 150)">
    <rect x="0" y="-46" width="64" height="64" rx="14" fill="#5e5653"/>
    <path d="M26 -36 L16 -10 h10 l-4 18 l20 -28 h-12 l8 -16 z" fill="#ab978c"/>
    <text x="88" y="6" font-family="Poppins, Segoe UI, system-ui, Arial, sans-serif" font-size="58" font-weight="700" fill="#5e5653">TheYard</text>
  </g>

  <text x="112" y="264" font-family="Poppins, Segoe UI, system-ui, Arial, sans-serif" font-size="40" font-weight="500" fill="#5e5653">A used-vehicle auction platform,</text>
  <text x="112" y="316" font-family="Poppins, Segoe UI, system-ui, Arial, sans-serif" font-size="40" font-weight="500" fill="#5e5653">with its reasoning served from inside it.</text>

  <g font-family="Poppins, Segoe UI, system-ui, Arial, sans-serif">
    <rect x="112" y="374" width="304" height="108" rx="16" fill="#e4e9f1"/>
    <text x="140" y="424" font-size="38" font-weight="700" fill="#536786">100,000</text>
    <text x="140" y="458" font-size="22" font-weight="500" fill="#5f636c">listings</text>
    <rect x="448" y="374" width="304" height="108" rx="16" fill="#e4e9f1"/>
    <text x="476" y="424" font-size="38" font-weight="700" fill="#536786">57</text>
    <text x="476" y="458" font-size="22" font-weight="500" fill="#5f636c">decision records</text>
    <rect x="784" y="374" width="304" height="108" rx="16" fill="#e4e9f1"/>
    <text x="812" y="424" font-size="38" font-weight="700" fill="#536786">.NET 10</text>
    <text x="812" y="458" font-size="22" font-weight="500" fill="#5f636c">and React 19</text>
  </g>

  <text x="112" y="534" font-family="Poppins, Segoe UI, system-ui, Arial, sans-serif" font-size="24" font-weight="500" fill="#5f636c">theyard.stevenstout.biz</text>
  <text x="1088" y="534" text-anchor="end" font-family="Poppins, Segoe UI, system-ui, Arial, sans-serif" font-size="24" font-weight="500" fill="#5f636c">Steven Stout · 1.0.0.82</text>
</svg>
