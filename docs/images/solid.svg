<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1320" width="900" height="1320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="solid-title">
  <title id="solid-title">SOLID in plain words: Single Responsibility, Open / Closed, Liskov Substitution, Interface Segregation and Dependency Inversion, each with where TheYard shows it</title>
  <style>
      .ground { fill: #f4f2f3; }
      .card { fill: #ffffff; stroke: #d8d3d4; stroke-width: 1.5; }
      .heading { fill: #10495a; font-size: 40px; font-weight: 800; }
      .caption { fill: #5e5653; font-size: 21px; }
      .letter { fill: #ffffff; font-size: 92px; font-weight: 800; }
      .name { font-size: 29px; font-weight: 800; }
      .plain { fill: #332f2c; font-size: 22px; }
      .yard-label { font-size: 19px; font-weight: 700; }
      .yard { fill: #5e5653; font-size: 19px; }
      .icon { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #ffffff; }
  </style>
  <rect width="900" height="1320" class="ground"/>
  <text x="40" y="64" class="heading">SOLID, in plain words</text>
  <text x="40" y="100" class="caption">Five habits that let code change without breaking.</text>
  <rect x="20" y="132" width="860" height="218" rx="18" class="card"/>
  <path d="M38 132 H176 V350 H38 A18 18 0 0 1 20 332 V150 A18 18 0 0 1 38 132 Z" fill="#0f4452"/>
  <text x="98" y="232" text-anchor="middle" class="letter">S</text>
  <g transform="translate(66 250)"><circle cx="32" cy="32" r="28" class="icon"/><circle cx="32" cy="32" r="16" class="icon"/><circle cx="32" cy="32" r="5" class="icon-fill"/></g>
  <text x="200" y="180" class="name" fill="#0f4452">Single Responsibility</text>
  <text x="200" y="218" class="plain">Each class has one job, so it has only one reason to</text>
  <text x="200" y="248" class="plain">change.</text>
  <text x="200" y="288" class="yard-label" fill="#0f4452">In TheYard</text>
  <text x="200" y="314" class="yard">A bidding rule lives once, in Domain, and Program.cs is a short</text>
  <text x="200" y="340" class="yard">list with one call per part.</text>
  <rect x="20" y="368" width="860" height="218" rx="18" class="card"/>
  <path d="M38 368 H176 V586 H38 A18 18 0 0 1 20 568 V386 A18 18 0 0 1 38 368 Z" fill="#12677f"/>
  <text x="98" y="468" text-anchor="middle" class="letter">O</text>
  <g transform="translate(66 486)"><rect x="4" y="16" width="30" height="32" rx="4" class="icon"/><rect x="38" y="16" width="22" height="32" rx="4" class="icon" stroke-dasharray="5 4"/><path d="M49 26 V38 M43 32 H55" class="icon"/></g>
  <text x="200" y="416" class="name" fill="#12677f">Open / Closed</text>
  <text x="200" y="454" class="plain">Add new behaviour by writing new code. Leave the code</text>
  <text x="200" y="484" class="plain">that already works alone.</text>
  <text x="200" y="524" class="yard-label" fill="#12677f">In TheYard</text>
  <text x="200" y="550" class="yard">Cosmos DB arrived as new adapter classes behind the same ports</text>
  <text x="200" y="576" class="yard">the SQL store uses.</text>
  <rect x="20" y="604" width="860" height="218" rx="18" class="card"/>
  <path d="M38 604 H176 V822 H38 A18 18 0 0 1 20 804 V622 A18 18 0 0 1 38 604 Z" fill="#1f7894"/>
  <text x="98" y="704" text-anchor="middle" class="letter">L</text>
  <g transform="translate(66 722)"><rect x="4" y="6" width="24" height="20" rx="4" class="icon"/><rect x="36" y="38" width="24" height="20" rx="4" class="icon"/><path d="M34 16 H54 L48 10 M54 16 L48 22" class="icon"/><path d="M30 48 H10 L16 42 M10 48 L16 54" class="icon"/></g>
  <text x="200" y="652" class="name" fill="#1f7894">Liskov Substitution</text>
  <text x="200" y="690" class="plain">Anything that stands in for something else has to behave</text>
  <text x="200" y="720" class="plain">the same way.</text>
  <text x="200" y="760" class="yard-label" fill="#1f7894">In TheYard</text>
  <text x="200" y="786" class="yard">The same test suite runs against both stores, and a change that</text>
  <text x="200" y="812" class="yard">touches either store has to pass on both.</text>
  <rect x="20" y="840" width="860" height="218" rx="18" class="card"/>
  <path d="M38 840 H176 V1058 H38 A18 18 0 0 1 20 1040 V858 A18 18 0 0 1 38 840 Z" fill="#7d6326"/>
  <text x="98" y="940" text-anchor="middle" class="letter">I</text>
  <g transform="translate(66 958)"><circle cx="32" cy="10" r="7" class="icon"/><path d="M32 17 V28 M10 28 H54 M10 28 V40 M32 28 V40 M54 28 V40" class="icon"/><rect x="2" y="40" width="16" height="18" rx="3" class="icon"/><rect x="24" y="40" width="16" height="18" rx="3" class="icon"/><rect x="46" y="40" width="16" height="18" rx="3" class="icon"/></g>
  <text x="200" y="888" class="name" fill="#7d6326">Interface Segregation</text>
  <text x="200" y="926" class="plain">Keep interfaces small and shaped to the code that calls</text>
  <text x="200" y="956" class="plain">them.</text>
  <text x="200" y="996" class="yard-label" fill="#7d6326">In TheYard</text>
  <text x="200" y="1022" class="yard">The auction uses three small ports, not one repository that does</text>
  <text x="200" y="1048" class="yard">everything.</text>
  <rect x="20" y="1076" width="860" height="218" rx="18" class="card"/>
  <path d="M38 1076 H176 V1294 H38 A18 18 0 0 1 20 1276 V1094 A18 18 0 0 1 38 1076 Z" fill="#7d582e"/>
  <text x="98" y="1176" text-anchor="middle" class="letter">D</text>
  <g transform="translate(66 1194)"><path d="M4 32 H22" class="icon"/><rect x="22" y="20" width="14" height="24" rx="3" class="icon"/><path d="M36 26 H44 M36 38 H44" class="icon"/><path d="M50 14 V50 M50 14 H60 M50 50 H60" class="icon"/></g>
  <text x="200" y="1124" class="name" fill="#7d582e">Dependency Inversion</text>
  <text x="200" y="1162" class="plain">Important code depends on contracts it owns, never on</text>
  <text x="200" y="1192" class="plain">the database underneath it.</text>
  <text x="200" y="1232" class="yard-label" fill="#7d582e">In TheYard</text>
  <text x="200" y="1258" class="yard">Application declares IBidStore; each store implements it, and</text>
  <text x="200" y="1284" class="yard">startup wires the one in use.</text>
</svg>
