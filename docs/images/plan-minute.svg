<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, Arial, sans-serif" font-size="14">
  <title>The plan's minute: Azure Monitor read once a minute by PlanRecorder on the SQL site, kept in the plan container in Cosmos DB for thirty-one days, served by GET /api/admin/plan from the kept copy, and drawn by the plan card</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a6c96"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #536786; stroke-width: 1.5; }
      .keep { fill: #ffffff; stroke: #25663a; stroke-width: 2; }
      .title { fill: #3f3a37; font-size: 16px; font-weight: 700; }
      .body { fill: #5e5653; font-size: 12.5px; }
      .mono { fill: #5e5653; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 11.5px; }
      .flow { stroke: #4a6c96; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .live { stroke: #4a6c96; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .label { fill: #4a6c96; font-size: 12px; font-weight: 500; }
      .heading { fill: #3f3a37; font-size: 22px; font-weight: 700; }
      .caption { fill: #62666f; font-size: 13px; }
    </style>
  </defs>
  <rect width="1400" height="560" fill="#e9e6e7"/>
  <text x="40" y="48" class="heading">The plan's minute, from Azure to the card</text>
  <text x="40" y="74" class="caption">One reading a minute, written by one site and kept a month; the card reads the kept copy, and Azure is asked again only when that copy is stale.</text>

  <rect x="40" y="130" width="260" height="190" rx="8" class="box"/>
  <text x="58" y="160" class="title">Azure Monitor</text>
  <text x="58" y="186" class="mono">PLAN-THEYARD-SS, B2</text>
  <text x="58" y="210" class="body">CPU, memory, the HTTP and disk</text>
  <text x="58" y="228" class="body">queues, bytes, outbound sockets;</text>
  <text x="58" y="246" class="body">each app's CPU time, working set,</text>
  <text x="58" y="264" class="body">requests and errors. The Activity</text>
  <text x="58" y="282" class="body">Log and the apps' state hourly.</text>

  <rect x="380" y="130" width="280" height="190" rx="8" class="box"/>
  <text x="398" y="160" class="title">PlanRecorder</text>
  <text x="398" y="186" class="mono">the SQL site only</text>
  <text x="398" y="210" class="body">Reads the last five minutes once a</text>
  <text x="398" y="228" class="body">minute, so a minute Azure reported</text>
  <text x="398" y="246" class="body">late is caught; stamps each with the</text>
  <text x="398" y="264" class="body">build it ran, which is where the</text>
  <text x="398" y="282" class="body">deploy marks come from.</text>

  <rect x="740" y="130" width="280" height="190" rx="8" class="keep"/>
  <text x="758" y="160" class="title">Cosmos DB, plan container</text>
  <text x="758" y="186" class="mono">/day, 2,678,400 s to live</text>
  <text x="758" y="210" class="body">One document a minute and one an</text>
  <text x="758" y="228" class="body">hour, partitioned on the UTC day,</text>
  <text x="758" y="246" class="body">expired by the container thirty-one</text>
  <text x="758" y="264" class="body">days on, so it is its own retention.</text>

  <rect x="1100" y="130" width="260" height="190" rx="8" class="box"/>
  <text x="1118" y="160" class="title">The plan card</text>
  <text x="1118" y="186" class="mono">GET /api/admin/plan</text>
  <text x="1118" y="210" class="body">24h, 7d or 30d from the kept copy,</text>
  <text x="1118" y="228" class="body">cached a minute: two dials, the</text>
  <text x="1118" y="246" class="body">month with deploys and Azure's</text>
  <text x="1118" y="264" class="body">events on one line, four questions,</text>
  <text x="1118" y="282" class="body">a readout. Asked every 30 s.</text>

  <path class="flow" d="M300 225 L376 225"/>
  <text x="312" y="214" class="label">a minute</text>
  <path class="flow" d="M660 225 L736 225"/>
  <text x="672" y="214" class="label">upsert</text>
  <path class="flow" d="M1020 225 L1096 225"/>
  <text x="1030" y="214" class="label">read</text>

  <path class="live" d="M1230 320 C1230 430, 520 430, 520 324"/>
  <text x="700" y="420" class="label">only when the newest kept minute ended more than sixty seconds ago: one read, then the kept copy again</text>

  <text x="40" y="520" class="caption">Source: docs/images/plan-minute.svg in the repository, drawn by hand (ADR: The App Service plan, read every minute).</text>
</svg>
