<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, Arial, sans-serif" font-size="14">
  <title>Old folders are zipped, not kept: every night at 03:40 the archive job checks that no cost1123 row is open, picks the units old enough, refuses a nightly day with an unsettled run or one a live document names, then for each unit zips it, reopens the zip and checks every entry against a second read of its source, writes one line to ARCHIVE-LOG.tsv, and only then moves the originals by one rename under _to_delete; a zip that does not match is renamed .failed and the source stays where it was; nothing is deleted</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a6c96"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#25663a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3b2e"/>
    </marker>
    <style>
      .ring1 { fill: #ece9ea; stroke: #7b7f8a; stroke-width: 1.5; }
      .part { fill: #ffffff; stroke: #536786; stroke-width: 1.5; }
      .pass { fill: #ffffff; stroke: #25663a; stroke-width: 2; }
      .fail { fill: #ffffff; stroke: #9a3b2e; stroke-width: 2; stroke-dasharray: 7 4; }
      .head { font-size: 22px; font-weight: 700; fill: #1f2a3a; }
      .name { font-size: 16px; font-weight: 700; fill: #1f2a3a; }
      .note { font-size: 13px; fill: #3d4756; }
      .flow { stroke: #4a6c96; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow-green { stroke: #25663a; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .flow-red { stroke: #9a3b2e; stroke-width: 2; fill: none; stroke-dasharray: 7 4; marker-end: url(#arrow-red); }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#f7f5f6"/>
  <text x="40" y="52" class="head">Old folders are zipped, not kept</text>
  <text x="40" y="78" class="note">JobHunt.Server archive, every night at 03:40 Central on WickedAwsome. Nothing is deleted.</text>

  <rect x="40" y="110" width="920" height="96" rx="10" class="ring1"/>
  <rect x="60" y="126" width="270" height="64" rx="8" class="part"/>
  <text x="76" y="152" class="name">Is cost1123 working?</text>
  <text x="76" y="174" class="note">An open row on state.md: do nothing</text>
  <rect x="365" y="126" width="270" height="64" rx="8" class="part"/>
  <text x="381" y="152" class="name">Pick what is old enough</text>
  <text x="381" y="174" class="note">Over 14 days; five of a kind a run</text>
  <rect x="670" y="126" width="270" height="64" rx="8" class="fail"/>
  <text x="686" y="152" class="name">Refuse a held day</text>
  <text x="686" y="174" class="note">Unsettled run, or a document names it</text>
  <path d="M330 158 L360 158" class="flow"/>
  <path d="M635 158 L665 158" class="flow-red"/>

  <path d="M500 190 L500 250" class="flow"/>

  <rect x="40" y="256" width="920" height="150" rx="10" class="ring1"/>
  <text x="60" y="282" class="note">For each unit, in this order</text>
  <rect x="60" y="298" width="200" height="88" rx="8" class="part"/>
  <text x="76" y="326" class="name">1. Zip</text>
  <text x="76" y="348" class="note">Every file, its path</text>
  <text x="76" y="366" class="note">from J:\ kept</text>
  <rect x="290" y="298" width="200" height="88" rx="8" class="part"/>
  <text x="306" y="326" class="name">2. Reopen, check</text>
  <text x="306" y="348" class="note">Each entry's length and</text>
  <text x="306" y="366" class="note">CRC-32 = a second read</text>
  <rect x="520" y="298" width="200" height="88" rx="8" class="pass"/>
  <text x="536" y="326" class="name">3. Log</text>
  <text x="536" y="348" class="note">One line in</text>
  <text x="536" y="366" class="note">ARCHIVE-LOG.tsv</text>
  <rect x="750" y="298" width="190" height="88" rx="8" class="pass"/>
  <text x="766" y="326" class="name">4. Move</text>
  <text x="766" y="348" class="note">One rename into</text>
  <text x="766" y="366" class="note">_to_delete</text>
  <path d="M260 342 L285 342" class="flow"/>
  <path d="M490 342 L515 342" class="flow-green"/>
  <path d="M720 342 L745 342" class="flow-green"/>

  <path d="M390 386 L390 466" class="flow-red"/>
  <rect x="200" y="470" width="380" height="70" rx="8" class="fail"/>
  <text x="216" y="498" class="name">Does not match</text>
  <text x="216" y="520" class="note">The zip is renamed .failed; the source stays put</text>

  <rect x="620" y="470" width="320" height="110" rx="8" class="part"/>
  <text x="636" y="498" class="name">The daily line</text>
  <text x="636" y="520" class="note">Names each refused day and why,</text>
  <text x="636" y="540" class="note">and any moved folder that came back,</text>
  <text x="636" y="560" class="note">as a NOTE row for the morning</text>
  <path d="M845 386 L845 465" class="flow"/>
</svg>
