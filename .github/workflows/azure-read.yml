name: Azure read

# Reads Azure Monitor with no machine (ADR: The gate runs where the memory is, the addendum of 1.0.4.105). Read
# only: every metric is asked with a start and an end (a start alone reads one hour) and --top 100 (the default keeps
# ten series), and the raw answers leave as the run's artifact, azure-read, with an index of what was asked.
on:
  workflow_dispatch:
    inputs:
      read:
        description: What to read
        required: true
        type: choice
        options:
          - cosmos-throttling
          - storage-egress

permissions:
  id-token: write
  contents: read

# One read at a time; a second waits, so two never ask Azure Monitor for the same spans at once.
concurrency:
  group: azure-read
  cancel-in-progress: false

jobs:
  read:
    environment: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # #region cosmos-throttling
      # Where Cosmos DB's 429s fall, by container and operation, over a day and a week; the share each container
      # takes; and the partition's normalized RU at one minute for six hours.
      - name: Cosmos DB throttling
        if: inputs.read == 'cosmos-throttling'
        run: |
          out="$RUNNER_TEMP/azure-read"; mkdir -p "$out"; index="$out/index.txt"
          acct=$(az cosmosdb show -g RG-THEYARD-SS -n cosmos-theyard-ss --query id -o tsv)
          endH=$(date -u +%Y-%m-%dT%H:00:00Z); s24=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:00:00Z); s7d=$(date -u -d '7 days ago' +%Y-%m-%dT%H:00:00Z)
          endM=$(date -u +%Y-%m-%dT%H:%M:00Z); s6h=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:00Z)
          echo "spans 24h $s24..$endH  7d $s7d..$endH  6h $s6h..$endM" > "$index"
          read_metric() {
            az monitor metrics list --resource "$acct" --metric "$2" --aggregation "$3" --interval "$4" --start-time "$5" --end-time "$6" --filter "$7" --top 100 -o json > "$out/$1.json"
            echo "$1	$2 $3 $4 $5..$6 [$7] $(wc -c < "$out/$1.json") bytes" >> "$index"
          }
          read_metric 429-by-coll-24h TotalRequests Count PT1H "$s24" "$endH" "StatusCode eq '429' and CollectionName eq '*'"
          read_metric 429-by-op-24h TotalRequests Count PT1H "$s24" "$endH" "StatusCode eq '429' and OperationType eq '*'"
          read_metric 429-by-coll-op-24h TotalRequests Count PT1H "$s24" "$endH" "StatusCode eq '429' and CollectionName eq '*' and OperationType eq '*'"
          read_metric 429-by-coll-7d TotalRequests Count PT1H "$s7d" "$endH" "StatusCode eq '429' and CollectionName eq '*'"
          read_metric req-by-coll-24h TotalRequests Count PT1H "$s24" "$endH" "CollectionName eq '*'"
          read_metric req-by-coll-7d TotalRequests Count PT1H "$s7d" "$endH" "CollectionName eq '*'"
          read_metric nru-by-pkr-6h NormalizedRUConsumption Maximum PT1M "$s6h" "$endM" "PartitionKeyRangeId eq '*'"
          read_metric nru-by-coll-6h NormalizedRUConsumption Maximum PT1M "$s6h" "$endM" "CollectionName eq '*'"
          cat "$index"
      # #endregion cosmos-throttling

      # #region storage-egress
      # Which side of the storage account the blob card's egress number is: the blob service, the file service (the
      # share) and the account itself, side by side. Egress and Transactions on each service, split by ApiName and by
      # Authentication, hourly for a week and daily from the 1st of the month; the account's Egress daily, unsplit.
      - name: Storage egress
        if: inputs.read == 'storage-egress'
        run: |
          out="$RUNNER_TEMP/azure-read"; mkdir -p "$out"; index="$out/index.txt"
          acct=$(az storage account show -g RG-JOBHUNT-SS -n stjobhuntss --query id -o tsv)
          endH=$(date -u +%Y-%m-%dT%H:00:00Z); s7d=$(date -u -d '7 days ago' +%Y-%m-%dT%H:00:00Z); sMon=$(date -u +%Y-%m-01T00:00:00Z)
          echo "spans 7d $s7d..$endH  month $sMon..$endH" > "$index"
          read_metric() {
            filter=(); [ -n "$7" ] && filter=(--filter "$7")
            az monitor metrics list --resource "$2" --metric "$3" --aggregation Total --interval "$4" --start-time "$5" --end-time "$6" "${filter[@]}" --top 100 -o json > "$out/$1.json"
            echo "$1	$3 Total $4 $5..$6 [$7] $(wc -c < "$out/$1.json") bytes" >> "$index"
          }
          for svc in blob file; do
            res="$acct/${svc}Services/default"
            for metric in Egress Transactions; do
              for dim in ApiName Authentication; do
                read_metric "$svc-${metric,,}-by-${dim,,}-7d" "$res" "$metric" PT1H "$s7d" "$endH" "$dim eq '*'"
                read_metric "$svc-${metric,,}-by-${dim,,}-month" "$res" "$metric" P1D "$sMon" "$endH" "$dim eq '*'"
              done
            done
            read_metric "$svc-egress-month" "$res" Egress P1D "$sMon" "$endH" ""
          done
          read_metric account-egress-month "$acct" Egress P1D "$sMon" "$endH" ""
          cat "$index"
      # #endregion storage-egress

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: azure-read
          path: ${{ runner.temp }}/azure-read/
          # The repository is public: a raw read is kept a week, long enough to read, then it goes.
          retention-days: 7
