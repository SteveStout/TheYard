# Nightly: the job hunt's runs as Claude Code on a GitHub runner: the 4:00 AM reply lane
# (NIGHTLY-LANE.md) and, every four hours, the records run (BOOKKEEPING-LANE.md); each run
# writes only in its own folder, nightly/<date>/<HHMM>-<mode>-<model>/
# (mentor\PROMPT-JOBHUNT-CLOUD-NATIVE.md in Steve's job-hunt folder, step 3).
# Not part of TheYard's site and it rolls nothing.
#
# Started by the Function in infra/jobhunt.bicep with repository_dispatch
# "nightly" after it has snapshotted the share and opened the bookend, or by
# hand with workflow_dispatch. The share is mounted over SMB at /mnt/jobhunt;
# the lane reads its prompt from nightly/ on the share and writes only in
# its run folder and the merger inboxes.
#
# The model is billed to Steve's Claude plan through CLAUDE_CODE_OAUTH_TOKEN
# (code.claude.com/docs/en/github-actions, read 2026-10-20: "an OAuth token
# that authenticates with your Claude subscription, available on Pro, Max,
# Team, and Enterprise plans"). Tokens and wall time land in usage.json beside
# the night's DONE note.
name: Nightly
# Every run names its lane, so the Admin tab's nightly card can read it off GitHub's list of runs:
# a dispatch is named by its type (nightly or bookkeeping), a run by hand by its mode, with
# " (dry run)" after it when it was one.
run-name: ${{ github.event_name == 'repository_dispatch' && github.event.action || format('{0}{1}', inputs.mode, inputs.dry_run && ' (dry run)' || '') }}

on:
  repository_dispatch:
    # nightly: the 4:00 AM reply lane. bookkeeping: the four-hour records run (inbox, CSV, Sheet).
    types: [nightly, bookkeeping]
  workflow_dispatch:
    inputs:
      mode:
        description: "reply (the 4:00 AM lane) or bookkeeping (the records run)"
        type: choice
        options: [reply, bookkeeping]
        default: reply
      model:
        description: "Model id; empty takes the mode's default"
        type: string
        default: ""
      dry_run:
        description: "Read and report only: no archive, no tracker rows, no Sheet writes"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: jobhunt-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHARE: //stjobhuntss.file.core.windows.net/jobhunt
    steps:
      - name: Date, slot, mode and model
        id: day
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          IN_MODE: ${{ inputs.mode }}
          IN_MODEL: ${{ inputs.model }}
          IN_DRY: ${{ inputs.dry_run }}
          BOOKKEEPING_MODEL: ${{ vars.BOOKKEEPING_MODEL }}
        run: |
          if [ "$EVENT" = "repository_dispatch" ]; then
            if [ "$ACTION" = "bookkeeping" ]; then mode=bookkeeping; else mode=reply; fi
            dry=false
          else
            mode="$IN_MODE"; dry="${IN_DRY:-false}"
          fi
          if [ -n "$IN_MODEL" ]; then model="$IN_MODEL"
          elif [ "$mode" = "bookkeeping" ]; then model="${BOOKKEEPING_MODEL:-claude-opus-5-5}"
          else model=claude-opus-5-5; fi
          if [ "$mode" = "bookkeeping" ]; then lane=BOOKKEEPING-LANE.md; else lane=NIGHTLY-LANE.md; fi
          day=$(TZ=America/Chicago date +%F); slot=$(TZ=America/Chicago date +%H%M)
          suffix=""; [ "$dry" = "true" ] && suffix="-dry"
          short=$(echo "$model" | sed 's/^claude-//')
          {
            echo "date=$day"; echo "mode=$mode"; echo "model=$model"; echo "lane=$lane"; echo "dry=$dry"
            echo "run_dir=nightly/$day/$slot-$mode-$short$suffix"
            echo "slot=${slot:0:2}:${slot:2:2}"; echo "started=$(date -u +%FT%TZ)"
          } >> "$GITHUB_OUTPUT"
          echo "$mode on $model at $day $slot (dry run: $dry)" >> "$GITHUB_STEP_SUMMARY"

      - name: Mount the share
        env:
          KEY: ${{ secrets.JOBHUNT_STORAGE_KEY }}
        run: |
          sudo apt-get install -y -qq cifs-utils > /dev/null
          sudo mkdir -p /mnt/jobhunt
          sudo mount -t cifs "$SHARE" /mnt/jobhunt -o "vers=3.1.1,username=stjobhuntss,password=$KEY,uid=$(id -u),gid=$(id -g),dir_mode=0775,file_mode=0664,serverino,nosharesock,actimeo=30"
          mkdir -p "/mnt/jobhunt/${{ steps.day.outputs.run_dir }}"
          test -f "/mnt/jobhunt/nightly/${{ steps.day.outputs.lane }}"

      - name: The lane
        id: lane
        uses: anthropics/claude-code-action@v1
        env:
          JOBHUNT: /mnt/jobhunt
          NIGHT: ${{ steps.day.outputs.date }}
          RUN_DIR: /mnt/jobhunt/${{ steps.day.outputs.run_dir }}
          MODE: ${{ steps.day.outputs.mode }}
          DRY_RUN: ${{ steps.day.outputs.dry }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SHEETS_SERVICE_ACCOUNT: ${{ secrets.SHEETS_SERVICE_ACCOUNT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's own token, so the Claude GitHub App is not needed: the lane reads
          # and writes the share, never this repository.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read /mnt/jobhunt/nightly/${{ steps.day.outputs.lane }} and follow it start to finish. Date ${{ steps.day.outputs.date }}; this run's folder is /mnt/jobhunt/${{ steps.day.outputs.run_dir }} (RUN_DIR in the environment); dry run: ${{ steps.day.outputs.dry }}.
          claude_args: |
            --model ${{ steps.day.outputs.model }}
            --max-turns 200
            --add-dir /mnt/jobhunt
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Tokens and wall time
        if: always()
        env:
          EXEC: ${{ steps.lane.outputs.execution_file }}
        run: |
          out="/mnt/jobhunt/${{ steps.day.outputs.run_dir }}/usage.json"
          if [ -f "$EXEC" ]; then
            jq '[.[] | select(.type == "result")] | last | {duration_ms, num_turns, usage, total_cost_usd}' "$EXEC" | tee "$out"
            jq -r '[.[] | select(.type == "result")] | last | "tokens in \(.usage.input_tokens) + cache read \(.usage.cache_read_input_tokens) + cache write \(.usage.cache_creation_input_tokens), out \(.usage.output_tokens), wall \(.duration_ms / 1000) s"' "$EXEC" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no execution file" | tee "$out"
          fi

      # #region usage-report
      # The run's usage.json, posted to the site as one usage document (ADR: Every Claude lane
      # reports its usage): the lane, the model, the mode, the slot, the four token counts, the
      # wall time, the API-equivalent cost and this run's id, and nothing else from the share. A
      # missing key, a missing usage.json or a refused post writes one line to the summary and
      # never fails the run: the night's work matters more than its report.
      - name: Report the usage to the site
        if: always()
        env:
          KEY: ${{ secrets.THEYARD_ADMIN_KEY }}
          SITE: ${{ vars.THEYARD_SITE || 'https://theyard.stevenstout.biz' }}
          MODEL: ${{ steps.day.outputs.model }}
          MODE: ${{ steps.day.outputs.mode }}
          DRY: ${{ steps.day.outputs.dry }}
          SLOT: ${{ steps.day.outputs.slot }}
          STARTED: ${{ steps.day.outputs.started }}
          RUN: ${{ github.run_id }}
        run: |
          usage="/mnt/jobhunt/${{ steps.day.outputs.run_dir }}/usage.json"
          if [ -z "$KEY" ]; then echo "usage not reported: THEYARD_ADMIN_KEY is not set" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if ! jq -e '.usage' "$usage" > /dev/null 2>&1; then echo "usage not reported: no usage in usage.json" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          [ "$DRY" = "true" ] && MODE="$MODE-dry"
          doc=$(jq -c --arg model "$MODEL" --arg mode "$MODE" --arg slot "$SLOT" --arg at "$STARTED" --arg run "$RUN" \
            '{lane: "Azure Functions, nightly lane", kind: "plan", model: $model,
              tokens_in: (.usage.input_tokens // 0), cache_write: (.usage.cache_creation_input_tokens // 0),
              cache_read: (.usage.cache_read_input_tokens // 0), tokens_out: (.usage.output_tokens // 0),
              wall_ms: (.duration_ms // 0), cost_usd: .total_cost_usd, run: $run, slot: $slot, mode: $mode, at: $at}' "$usage")
          if ! curl --fail-with-body -sS -X POST "$SITE/api/admin/usage" -H "X-Admin-Key: $KEY" -H 'content-type: application/json' --data "$doc"; then
            echo "usage not reported: the site refused the post" >> "$GITHUB_STEP_SUMMARY"
          fi
      # #endregion usage-report

      - name: Unmount
        if: always()
        run: sudo umount /mnt/jobhunt || true
