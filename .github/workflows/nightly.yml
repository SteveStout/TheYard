# Nightly: the job hunt's runs as Claude Code on a GitHub runner: the 4:00 AM reply lane
# (NIGHTLY-LANE.md), every four hours the records run (BOOKKEEPING-LANE.md), the inbox
# pass's triage step (TRIAGE-LANE.md, Sonnet at low effort) whenever the Function's 30-minute
# pass finds mail its code could not judge, and at 2:00 AM the jobs lane (JOBS-LANE.md, Opus)
# after the Function's picker wrote the night's candidates; each run
# writes only in its own folder, nightly/<date>/<HHMM>-<mode>-<model>/
# (mentor\PROMPT-JOBHUNT-CLOUD-NATIVE.md in Steve's job-hunt folder, step 3).
# Not part of TheYard's site and it rolls nothing.
#
# Started by the Function in infra/jobhunt.bicep with repository_dispatch
# "nightly" after it has snapshotted the share and opened the bookend, or by
# hand with workflow_dispatch. The share is mounted over SMB at /mnt/jobhunt;
# the lane reads its prompt from nightly/ on the share and writes only in
# its run folder and the merger inboxes.
#
# The model is billed to Steve's Claude plan through CLAUDE_CODE_OAUTH_TOKEN
# (code.claude.com/docs/en/github-actions, read 2026-10-20: "an OAuth token
# that authenticates with your Claude subscription, available on Pro, Max,
# Team, and Enterprise plans"). Tokens and wall time land in usage.json beside
# the night's DONE note.
name: Nightly
# Every run names its lane, so the Admin tab's nightly card can read it off GitHub's list of runs:
# a dispatch is named by its type (nightly or bookkeeping), a run by hand by its mode, with
# " (dry run)" after it when it was one.
run-name: ${{ github.event_name == 'repository_dispatch' && github.event.action || format('{0}{1}', inputs.mode, inputs.dry_run && ' (dry run)' || '') }}

on:
  repository_dispatch:
    # nightly: the 4:00 AM reply lane. bookkeeping: the four-hour records run (inbox, CSV, Sheet).
    # triage: the inbox pass's model step, the mail the Function's code could not judge.
    # leads: the leads list, LEADS.md ranked best first, when a pass harvested a lead nobody has scored.
    # jobs: the night's ranked jobs file, J:\JOBS-<date>.md, after the Function's 2 AM picker wrote its candidates.
    types: [nightly, bookkeeping, triage, leads, jobs]
  workflow_dispatch:
    inputs:
      mode:
        description: "reply (the 4:00 AM lane), bookkeeping (the records run), triage (the inbox pass's model step), leads (the leads list) or jobs (the night's jobs file)"
        type: choice
        options: [reply, bookkeeping, triage, leads, jobs]
        default: reply
      model:
        description: "Model id; empty takes the mode's default"
        type: string
        default: ""
      dry_run:
        description: "Read and report only: no archive, no tracker rows, no Sheet writes"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: jobhunt-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    # The longest lane is 55 minutes; a second attempt starts only within ten minutes of the run's start
    # (Did the lane begin, below), so 75 covers both and the reports.
    timeout-minutes: 75
    env:
      SHARE: //stjobhuntss.file.core.windows.net/jobhunt
    steps:
      - name: Date, slot, mode and model
        id: day
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          IN_MODE: ${{ inputs.mode }}
          IN_MODEL: ${{ inputs.model }}
          IN_DRY: ${{ inputs.dry_run }}
          BOOKKEEPING_MODEL: ${{ vars.BOOKKEEPING_MODEL }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
          LEADS_MODEL: ${{ vars.LEADS_MODEL }}
          JOBS_MODEL: ${{ vars.JOBS_MODEL }}
        run: |
          if [ "$EVENT" = "repository_dispatch" ]; then
            case "$ACTION" in bookkeeping) mode=bookkeeping ;; triage) mode=triage ;; leads) mode=leads ;; jobs) mode=jobs ;; *) mode=reply ;; esac
            dry=false
          else
            mode="$IN_MODE"; dry="${IN_DRY:-false}"
          fi
          if [ -n "$IN_MODEL" ]; then model="$IN_MODEL"
          elif [ "$mode" = "bookkeeping" ]; then model="${BOOKKEEPING_MODEL:-claude-opus-5-5}"
          elif [ "$mode" = "triage" ]; then model="${TRIAGE_MODEL:-claude-sonnet-5-5}"
          elif [ "$mode" = "leads" ]; then model="${LEADS_MODEL:-claude-sonnet-5-5}"
          elif [ "$mode" = "jobs" ]; then model="${JOBS_MODEL:-claude-opus-5-5}"
          else model=claude-opus-5-5; fi
          case "$mode" in bookkeeping) lane=BOOKKEEPING-LANE.md ;; triage) lane=TRIAGE-LANE.md ;; leads) lane=LEADS-LANE.md ;; jobs) lane=JOBS-LANE.md ;; *) lane=NIGHTLY-LANE.md ;; esac
          # The triage step and the leads list are the light ones: low effort, a few turns, minutes not an hour
          # The other modes keep Claude Code's default effort, so no flag is passed for them.
          if [ "$mode" = "triage" ] || [ "$mode" = "leads" ]; then effort="--effort low"; turns=40; minutes=10; else effort=""; turns=200; minutes=55; fi
          # The leads run finds each manager's address on public pages (ADR-118, Decision 5), so it alone reads the web;
          # it has more turns for that, and it still writes only its file on the share.
          tools="Bash,Read,Write,Edit,Glob,Grep"; lanename="Azure Functions, nightly lane"
          if [ "$mode" = "leads" ]; then tools="Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"; turns=80; minutes=20; lanename="Azure Functions, leads lane"; fi
          # The jobs lane confirms each candidate on the employer's own board and reads wage filings, so it reads the web too;
          # it keeps the default effort, and writes only the jobs file, its block in PRIORITY-BOARD.md and its run folder.
          if [ "$mode" = "jobs" ]; then tools="Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"; turns=80; minutes=40; lanename="Azure Functions, jobs lane"; fi
          day=$(TZ=America/Chicago date +%F); slot=$(TZ=America/Chicago date +%H%M)
          suffix=""; [ "$dry" = "true" ] && suffix="-dry"
          short=$(echo "$model" | sed 's/^claude-//')
          {
            echo "date=$day"; echo "mode=$mode"; echo "model=$model"; echo "lane=$lane"; echo "dry=$dry"
            echo "effort_flag=$effort"; echo "turns=$turns"; echo "minutes=$minutes"; echo "tools=$tools"; echo "lanename=$lanename"
            echo "run_dir=nightly/$day/$slot-$mode-$short$suffix"
            echo "slot=${slot:0:2}:${slot:2:2}"; echo "started=$(date -u +%FT%TZ)"
            # The id the lane registers under in state.md: the mode, the Central month and day, and the slot.
            echo "lane_id=${mode}${day:5:2}${day:8:2}-${slot}"
          } >> "$GITHUB_OUTPUT"
          echo "$mode on $model at $day $slot (dry run: $dry)" >> "$GITHUB_STEP_SUMMARY"

      - name: Mount the share
        env:
          KEY: ${{ secrets.JOBHUNT_STORAGE_KEY }}
        run: |
          sudo apt-get install -y -qq cifs-utils > /dev/null
          sudo mkdir -p /mnt/jobhunt
          sudo mount -t cifs "$SHARE" /mnt/jobhunt -o "vers=3.1.1,username=stjobhuntss,password=$KEY,uid=$(id -u),gid=$(id -g),dir_mode=0775,file_mode=0664,serverino,nosharesock,actimeo=30"
          mkdir -p "/mnt/jobhunt/${{ steps.day.outputs.run_dir }}"
          test -f "/mnt/jobhunt/nightly/${{ steps.day.outputs.lane }}"

      # #region lane-retry
      # A lane step whose setup dies before the lane begins runs once more, in every mode: when
      # setup-bun inside claude-code-action reads a 504 from its download, the next step finds no bun
      # and the run is lost before the lane reads a word (ADR-109's addendum on it). The first step
      # continues on error; "Did the lane begin" says again only when it failed, left no execution
      # file, wrote nothing in the run folder, and failed within ten minutes of the run's start, so a
      # lane that ran and failed on its own is never run twice. The verdict after both is the
      # attempt that ran, and it is what fails the job.
      - name: The lane
        id: lane
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.day.outputs.minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          JOBHUNT: /mnt/jobhunt
          NIGHT: ${{ steps.day.outputs.date }}
          RUN_DIR: /mnt/jobhunt/${{ steps.day.outputs.run_dir }}
          MODE: ${{ steps.day.outputs.mode }}
          DRY_RUN: ${{ steps.day.outputs.dry }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SHEETS_SERVICE_ACCOUNT: ${{ secrets.SHEETS_SERVICE_ACCOUNT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's own token, so the Claude GitHub App is not needed: the lane reads
          # and writes the share, never this repository.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read /mnt/jobhunt/nightly/${{ steps.day.outputs.lane }} and follow it start to finish. Date ${{ steps.day.outputs.date }}; this run's folder is /mnt/jobhunt/${{ steps.day.outputs.run_dir }} (RUN_DIR in the environment); dry run: ${{ steps.day.outputs.dry }}.
          claude_args: |
            --model ${{ steps.day.outputs.model }}
            --max-turns ${{ steps.day.outputs.turns }}
            ${{ steps.day.outputs.effort_flag }}
            --add-dir /mnt/jobhunt
            --allowedTools "${{ steps.day.outputs.tools }}"

      - name: Did the lane begin
        id: began
        if: steps.lane.outcome == 'failure'
        env:
          EXEC: ${{ steps.lane.outputs.execution_file }}
          JOBHUNT: /mnt/jobhunt
          RUN_DIR: ${{ steps.day.outputs.run_dir }}
          STARTED: ${{ steps.day.outputs.started }}
        run: |
          again=false
          took=$(( $(date -u +%s) - $(date -u -d "$STARTED" +%s) ))
          if { [ -z "$EXEC" ] || [ ! -f "$EXEC" ]; } && [ -z "$(ls -A "$JOBHUNT/$RUN_DIR" 2>/dev/null)" ] && [ "$took" -lt 600 ]; then again=true; fi
          echo "again=$again" >> "$GITHUB_OUTPUT"
          echo "the lane step failed after ${took} s with no execution file: once more is $again" >> "$GITHUB_STEP_SUMMARY"

      - name: The lane, once more
        id: lane_again
        if: steps.began.outputs.again == 'true'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.day.outputs.minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          JOBHUNT: /mnt/jobhunt
          NIGHT: ${{ steps.day.outputs.date }}
          RUN_DIR: /mnt/jobhunt/${{ steps.day.outputs.run_dir }}
          MODE: ${{ steps.day.outputs.mode }}
          DRY_RUN: ${{ steps.day.outputs.dry }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SHEETS_SERVICE_ACCOUNT: ${{ secrets.SHEETS_SERVICE_ACCOUNT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's own token, so the Claude GitHub App is not needed: the lane reads
          # and writes the share, never this repository.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read /mnt/jobhunt/nightly/${{ steps.day.outputs.lane }} and follow it start to finish. Date ${{ steps.day.outputs.date }}; this run's folder is /mnt/jobhunt/${{ steps.day.outputs.run_dir }} (RUN_DIR in the environment); dry run: ${{ steps.day.outputs.dry }}.
          claude_args: |
            --model ${{ steps.day.outputs.model }}
            --max-turns ${{ steps.day.outputs.turns }}
            ${{ steps.day.outputs.effort_flag }}
            --add-dir /mnt/jobhunt
            --allowedTools "${{ steps.day.outputs.tools }}"

      - name: The lane's verdict
        id: verdict
        if: always() && steps.lane.outcome != 'skipped'
        env:
          FIRST: ${{ steps.lane.outcome }}
          SECOND: ${{ steps.lane_again.outcome }}
        run: |
          came="$FIRST"
          if [ -n "$SECOND" ] && [ "$SECOND" != "skipped" ]; then came="$SECOND"; fi
          echo "came=$came" >> "$GITHUB_OUTPUT"
          echo "the lane came to $came" >> "$GITHUB_STEP_SUMMARY"
          [ "$came" = "success" ]
      # #endregion lane-retry

      - name: Tokens and wall time
        if: always()
        env:
          EXEC: ${{ steps.lane_again.outputs.execution_file || steps.lane.outputs.execution_file }}
        run: |
          out="/mnt/jobhunt/${{ steps.day.outputs.run_dir }}/usage.json"
          if [ -f "$EXEC" ]; then
            jq '[.[] | select(.type == "result")] | last | {duration_ms, num_turns, usage, total_cost_usd}' "$EXEC" | tee "$out"
            jq -r '[.[] | select(.type == "result")] | last | "tokens in \(.usage.input_tokens) + cache read \(.usage.cache_read_input_tokens) + cache write \(.usage.cache_creation_input_tokens), out \(.usage.output_tokens), wall \(.duration_ms / 1000) s"' "$EXEC" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no execution file" | tee "$out"
          fi

      # #region usage-report
      # The run's usage.json, posted to the site as one usage document (ADR: Every Claude lane
      # reports its usage): the lane, the model, the mode, the slot, the four token counts, the
      # wall time, the API-equivalent cost, this run's id and the lane's exit (the conclusion of the
      # attempt that ran, as the verdict step reads it; no exit field when there is no verdict), and
      # nothing else from the share. A
      # missing key, a missing usage.json or a refused post writes one line to the summary and
      # never fails the run: the night's work matters more than its report.
      - name: Report the usage to the site
        if: always()
        env:
          KEY: ${{ secrets.THEYARD_ADMIN_KEY }}
          SITE: ${{ vars.THEYARD_SITE || 'https://theyard.stevenstout.biz' }}
          MODEL: ${{ steps.day.outputs.model }}
          MODE: ${{ steps.day.outputs.mode }}
          DRY: ${{ steps.day.outputs.dry }}
          SLOT: ${{ steps.day.outputs.slot }}
          STARTED: ${{ steps.day.outputs.started }}
          RUN: ${{ github.run_id }}
          LANE: ${{ steps.day.outputs.lanename }}
          USAGE: /mnt/jobhunt/${{ steps.day.outputs.run_dir }}/usage.json
          EXIT: ${{ steps.verdict.outputs.came }}
        run: |
          usage="$USAGE"
          if [ -z "$KEY" ]; then echo "usage not reported: THEYARD_ADMIN_KEY is not set" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if ! jq -e '.usage' "$usage" > /dev/null 2>&1; then echo "usage not reported: no usage in usage.json" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          [ "$DRY" = "true" ] && MODE="$MODE-dry"
          doc=$(jq -c --arg model "$MODEL" --arg mode "$MODE" --arg slot "$SLOT" --arg at "$STARTED" --arg run "$RUN" --arg lane "${LANE:-Azure Functions, nightly lane}" --arg exit "$EXIT" \
            '{lane: $lane, kind: "plan", model: $model,
              tokens_in: (.usage.input_tokens // 0), cache_write: (.usage.cache_creation_input_tokens // 0),
              cache_read: (.usage.cache_read_input_tokens // 0), tokens_out: (.usage.output_tokens // 0),
              wall_ms: (.duration_ms // 0), cost_usd: .total_cost_usd, run: $run, slot: $slot, mode: $mode, at: $at}
              + (if $exit == "" then {} else {exit: $exit} end)' "$usage")
          if ! curl --fail-with-body -sS -X POST "$SITE/api/admin/usage" -H "X-Admin-Key: $KEY" -H 'content-type: application/json' --data "$doc"; then
            echo "usage not reported: the site refused the post" >> "$GITHUB_STEP_SUMMARY"
          fi
      # #endregion usage-report

      # #region nightly-run-report
      # This run, posted to the site as one nightly run (ADR: The Nightly Function on the Admin
      # tab): GitHub's own facts for it (the id, the number, the event, the display title, when it
      # started and how long it had taken) and what the job had come to at
      # this step, and nothing else. The site reads the slot, the lane, whether it was a dry run and
      # who started it off the event and the title by the same rules it reads GitHub's own list by,
      # so a run posted here and the same run read from GitHub are one document. This is what
      # retires the nightly card's hourly read of GitHub and its sixty-an-hour allowance.
      # job.status is the run as this step knows it: GitHub's final conclusion can still differ (a
      # later step can fail, and the run can be cancelled after this), and the card's reader
      # reconciles it against GitHub's own list on its daily read, which is why that read stays. A
      # missing key or a refused post writes one line to the summary and never fails the run: the
      # night's work matters more than its report.
      - name: Report this run to the site
        if: always()
        env:
          KEY: ${{ secrets.THEYARD_ADMIN_KEY }}
          SITE: ${{ vars.THEYARD_SITE || 'https://theyard.stevenstout.biz' }}
          RUN: ${{ github.run_id }}
          NUMBER: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
          # The run name, which is what GitHub keeps as the run's display title.
          TITLE: ${{ github.event_name == 'repository_dispatch' && github.event.action || format('{0}{1}', inputs.mode, inputs.dry_run && ' (dry run)' || '') }}
          STARTED: ${{ steps.day.outputs.started }}
          CAME_TO: ${{ job.status }}
        run: |
          if [ -z "$KEY" ]; then echo "run not reported: THEYARD_ADMIN_KEY is not set" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          took=$(( $(date -u +%s) - $(date -u -d "$STARTED" +%s) ))
          doc=$(jq -nc --arg run "$RUN" --argjson number "$NUMBER" --arg event "$EVENT" --arg title "$TITLE" \
            --arg at "$STARTED" --argjson took "$took" --arg came_to "$CAME_TO" \
            '{run: $run, number: $number, event: $event, title: $title, at: $at, took_seconds: $took, came_to: $came_to}')
          if ! curl --fail-with-body -sS -X POST "$SITE/api/admin/cloud/nightly/run" -H "X-Admin-Key: $KEY" -H 'content-type: application/json' --data "$doc"; then
            echo "run not reported: the site refused the post" >> "$GITHUB_STEP_SUMMARY"
          fi
      # #endregion nightly-run-report

      # #region lane-close
      # A lane that registered in state.md is closed there, whatever the run came to. The lane writes
      # its own CLOSED row through the state.md spool; when it wrote none (a reply lane that closed only
      # its bookend, a lane that died or timed out), this step writes one, so the 6 AM program's
      # second-driver check never reads a finished lane as open. It looks for the registration and the
      # close in the spool, its merged folder (the last day) and the end of state.md, writes the row
      # aside as a dot file the merger skips, and renames it in. A lane that never registered (a dry
      # run, a triage pass) gets no row. A failed write is one summary line and never fails the run.
      - name: Close the lane's row
        if: always()
        continue-on-error: true
        env:
          JOBHUNT: /mnt/jobhunt
          RUN_DIR: ${{ steps.day.outputs.run_dir }}
          LANE_ID: ${{ steps.day.outputs.lane_id }}
          CAME_TO: ${{ job.status }}
          RUN: ${{ github.run_id }}
        run: |
          spool="$JOBHUNT/inbox/append-inbox/state.md"
          if [ -z "$LANE_ID" ] || [ ! -d "$JOBHUNT/inbox" ]; then echo "no close row: the share is not mounted or the run has no lane id" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          rows=$( { find "$spool" "$spool/merged" -maxdepth 1 -name '*.md' -mmin -1440 -exec cat {} + 2>/dev/null || true; tail -c 400000 "$JOBHUNT/state.md" 2>/dev/null || true; } | grep -a -F "## LANE: $LANE_ID" || true)
          if ! printf '%s\n' "$rows" | grep -a -q -E "^## LANE: $LANE_ID( |\$)"; then echo "no close row: $LANE_ID did not register" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if printf '%s\n' "$rows" | grep -a -q -E "^## LANE: $LANE_ID( step [0-9]+)? CLOSED|\| *CLOSED *\| *$"; then echo "$LANE_ID closed its own row" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          done_note="DONE.md not written"
          if [ -f "$JOBHUNT/$RUN_DIR/DONE.md" ]; then done_note="DONE: $RUN_DIR/DONE.md"; fi
          at=$(TZ=America/Chicago date '+%H:%M CST %a %-m/%-d')
          name="$(date -u +%Y%m%d-%H%M%SZ)-$LANE_ID-close.md"
          printf '\n## LANE: %s CLOSED %s (GitHub Actions run %s came to %s; nightly.yml wrote this row because the lane wrote none). %s. Holds: none. | CLOSED |\n' \
            "$LANE_ID" "$at" "$RUN" "$CAME_TO" "$done_note" > "$spool/.$name.tmp"
          mv "$spool/.$name.tmp" "$spool/$name"
          echo "closed $LANE_ID: inbox/append-inbox/state.md/$name" >> "$GITHUB_STEP_SUMMARY"
      # #endregion lane-close

      - name: Unmount
        if: always()
        run: sudo umount /mnt/jobhunt || true
