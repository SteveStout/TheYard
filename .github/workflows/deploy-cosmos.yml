# Deploy Cosmos: the second site's own leg (ADR: A second store on Cosmos DB,
# and what it costs). It starts on the same push as Deploy, waits until
# Deploy's build has put the image in the registry, takes the same tag, and
# rolls the second site's web app on the same plan (ADR: One plan, two sites).
# No second build: one image, two sites, which is what makes the comparison
# honest. A failure here never touches the first site. Until 1.0.0.173 it
# waited for Deploy to finish, so the two rolls ran one after the other; now
# they run side by side and the plan's one machine starts both new containers
# at once, which costs each a little and saves the whole of one roll
# (ADR-009, addendum of 21 September).
name: Deploy Cosmos

# #region deploy-cosmos-trigger
on:
  push:
    branches: [main]
    # The sample under samples/ has its own deploy (deploy-shed.yml); see deploy.yml.
    paths-ignore:
      - "samples/**"
      - ".github/workflows/deploy-shed.yml"
  # And by hand: a roll of the current image, or stopping and starting the
  # second site. Stopping it saves nothing now, because the plan bills for the
  # machine whether one site runs on it or two; it is kept for the day the
  # second site has to come off the plan's memory in a hurry.
  workflow_dispatch:
    inputs:
      action:
        description: "roll (redeploy the current image), stop, or start"
        required: true
        default: roll
        type: choice
        options: [roll, stop, start]
# #endregion deploy-cosmos-trigger

permissions:
  id-token: write
  contents: read

# The latest push wins here too (ADR-009, addendum of 29 September): a newer
# push cancels the roll in flight and this site takes the newest image.
concurrency:
  group: deploy-cosmos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fifty minutes: ten waiting for the image, Verify's twenty-five for the version and ten for readiness, and room.
    timeout-minutes: 50
    env:
      REGISTRY_NAME: crtheyardsszmnetj67bn5h2
      ACR: crtheyardsszmnetj67bn5h2.azurecr.io
      RG: RG-THEYARD-SS
      # The second site's web app on the plan both sites share, and its own
      # address (ADR: One plan, two sites).
      APP: APP-THEYARD-COSMOS-SS-ZMNETJ67BN5H2
      ORIGIN: https://app-theyard-cosmos-ss-zmnetj67bn5h2.azurewebsites.net
      # Its public name, which the edge proxies to that origin; the edge is warmed through it.
      SITE: https://theyard-cosmos.stevenstout.biz
      AI_NAME: appi-theyard-ss
      # The same database Deploy composes a connection string for, so this
      # container runs both stores too (ADR: One container, both stores).
      SQL_SERVER: sql-theyard-ss-westus3
      # sqldb-theyard-ss-basic since 1.0.0.129, the same database the SQL site moved to at
      # 1.0.0.128 (ADR: The SQL Server backend, addendum of 14 September); this site warms
      # the relational store as its second, and the paused one read as a failed health check.
      SQL_DB: sqldb-theyard-ss-basic
      MI_CLIENT_ID: 2888a6ca-be1c-46a5-a1de-c666b1d193e5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # #region stop-start
      - name: Stop or start the site
        if: github.event_name == 'workflow_dispatch' && inputs.action != 'roll'
        run: |
          az webapp ${{ inputs.action }} -g "$RG" -n "$APP"
          az webapp show -g "$RG" -n "$APP" --query "{state:state, image:siteConfig.linuxFxVersion}" -o json
      # #endregion stop-start

      # #region compute-version
      # The same rule Deploy uses: the changelog's top line is the version, and
      # the image Deploy pushed for it is the one this rolls (ADR-031).
      - name: Compute version
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'roll'
        run: |
          N=$(sed -n 's/^- \*\*\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\*\*.*/\1/p' docs/CHANGELOG.md | sed -n 1p)
          if [ -z "$N" ]; then
            echo "::error file=docs/CHANGELOG.md::No version line at the top of the changelog, so there is no version to roll"
            exit 1
          fi
          {
            echo "APP_VERSION=$N"
            echo "IMAGE=$ACR/theyard:v$N"
          } >> "$GITHUB_ENV"
          echo "Rolling $APP to $ACR/theyard:v$N"
      # #endregion compute-version

      # #region roll-cosmos
      # A web app's settings live on the web app, so a roll is two calls: the
      # four values the template does not hold, then the image
      # (ADR: One plan, two sites). Both answer with -o none, because the first
      # would otherwise print every setting the site holds into this log. The
      # plan, the sites and every other setting are infra/appservice.bicep, and
      # a roll changes none of them.
      # #region wait-for-image
      # Deploy builds the image this site rolls to, on the same push. Wait for
      # the tag to be in the registry, ten minutes at most, rather than for
      # Deploy to finish: the build is the only thing this leg needs from it.
      - name: Wait for the image
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 120); do
            if az acr repository show-tags -n "$REGISTRY_NAME" --repository theyard -o tsv 2>/dev/null | grep -qx "v$APP_VERSION"; then
              echo "$IMAGE is in the registry after $((i * 5 - 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$IMAGE never reached the registry; Deploy's build did not finish"
          exit 1
      # #endregion wait-for-image

      - name: Roll the second site
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'roll'
        env:
          YARD_AUTH_SIGNING_KEY: ${{ secrets.YARD_AUTH_SIGNING_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          # The Application Insights connection string is an ingestion key, so it
          # lives only in Azure: read it here with the credential this job already
          # holds and mask it in the log. az resource show is core CLI; az monitor
          # app-insights would pull an extension at run time, which is a second
          # thing that can fail a deploy. Telemetry is an addition, not a
          # dependency: if the read fails, the site keeps the value it has and
          # still ships, because a deploy pipeline held hostage to its own
          # observability is worse than a quiet hour of no traces.
          CONN=$(az resource show -g "$RG" -n "$AI_NAME" \
            --resource-type "Microsoft.Insights/components" \
            --query "properties.ConnectionString" -o tsv 2>/dev/null || true)
          if [ -n "$CONN" ]; then
            echo "::add-mask::$CONN"
          fi
          # The database. The value names a server, a database and an
          # authentication mode; the credential is the site's managed identity,
          # which never leaves Azure. The name is composed rather than read back
          # from Azure: the first version of this asked `az sql server show`,
          # which this job's identity is not allowed to do, the call failed
          # silently, and 1.0.0.49 shipped on SQLite and said so. An Azure SQL
          # logical server's address is its name plus the service suffix. No
          # Connect Timeout, on purpose: YardConnection widens a timeout nobody
          # gave to sixty seconds, and a value given here wins over that
          # (ADR: The SQL Server backend).
          YARD_SQL=""
          if [ -n "$SQL_SERVER" ]; then
            YARD_SQL="Server=tcp:${SQL_SERVER}.database.windows.net,1433;Initial Catalog=${SQL_DB};Encrypt=True;TrustServerCertificate=False;Authentication=Active Directory Managed Identity;User Id=${MI_CLIENT_ID};"
          fi
          # #region secrets-cosmos
          # The session signing key and the operator's key, from the repository
          # secrets of the same names, handed to the step through env and written
          # to a file by python, so neither is ever part of a command line and
          # neither appears in a log: GitHub masks them, and the settings call
          # prints nothing. A value this job does not hold is left out, and the
          # site keeps what it has: the template's placeholder on a new site,
          # which the app reads as "no key", or the last roll's value
          # (ADR: Three readers with no memory of the project; ADR: Site
          # activity, and the line an address does not cross).
          CONN="$CONN" YARD_SQL="$YARD_SQL" python3 - "$RUNNER_TEMP/settings.json" <<'PY'
          import json, os, sys
          wanted = {
              "APPLICATIONINSIGHTS_CONNECTION_STRING": os.environ.get("CONN", ""),
              "ConnectionStrings__YardSql": os.environ.get("YARD_SQL", ""),
              "Auth__SigningKey": os.environ.get("YARD_AUTH_SIGNING_KEY", ""),
              "Admin__Key": os.environ.get("ADMIN_KEY", ""),
          }
          held = [{"name": name, "value": value, "slotSetting": False} for name, value in wanted.items() if value]
          for name, value in wanted.items():
              if not value:
                  print(f"::warning::{name} is not held by this job; the site keeps the value it has")
          json.dump(held, open(sys.argv[1], "w", encoding="utf-8"))
          print(f"{len(held)} of {len(wanted)} values go to the site (values masked)")
          PY
          # #endregion secrets-cosmos
          if [ "$(cat "$RUNNER_TEMP/settings.json")" != "[]" ]; then
            az webapp config appsettings set -g "$RG" -n "$APP" --settings "@$RUNNER_TEMP/settings.json" -o none
          fi
          rm -f "$RUNNER_TEMP/settings.json"
          # The image is the only thing that changes between rolls. App Service
          # starts the new container beside the old one and moves traffic when
          # the new one answers, so the site serves through its own roll.
          az webapp config set -g "$RG" -n "$APP" --linux-fx-version "DOCKER|$IMAGE" -o none
          az webapp show -g "$RG" -n "$APP" --query "{state:state, image:siteConfig.linuxFxVersion, host:defaultHostName}" -o json
      # #endregion roll-cosmos

      # #region verify-cosmos
      - name: Verify
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'roll'
        run: |
          # Every read here carries the self mark on its agent, so the Site
          # activity card counts it as the site's own (ADR: Site activity, 24 September).
          # Twenty-five minutes, read off the rolls: the new container starts 8 to 12
          # minutes after the image push and is ready 2 to 3.5 minutes after that, and
          # a ten-minute loop ended a roll that worked (ADR: The deploy pipeline, the
          # addendum on sizing Verify). Thirty seconds a read, because an API read
          # waits for the catalogue to load.
          budget=1500
          started=$SECONDS
          body=""
          until [[ "$body" == *"\"$APP_VERSION\""* ]]; do
            if (( SECONDS - started >= budget )); then
              echo "origin never served $APP_VERSION in ${budget}s (last answer: $body)"
              exit 1
            fi
            sleep 5
            body=$(curl -fsS -A "TheYard-SelfRead/1 (deploy)" --max-time 30 "$ORIGIN/api/version" || true)
          done
          echo "origin serves $APP_VERSION after $((SECONDS - started))s: $body"
          # Readiness is the container's own word that its files are in place and its
          # catalogue has loaded (ADR-010). The process listens before the catalogue is
          # in (ADR: The ports learn to wait, the addendum on listening first). An API
          # read waits for the load, so the version above usually arrives with it;
          # this wait says so in the container's own words before the filters are read.
          for i in $(seq 1 120); do
            if curl -fsS -A "TheYard-SelfRead/1 (deploy)" --max-time 10 "$ORIGIN/readyz" > /dev/null 2>&1; then
              echo "origin ready $(((i - 1) * 5))s after it served the version"
              break
            fi
            if [[ "$i" -eq 120 ]]; then
              echo "origin never said ready"
              exit 1
            fi
            sleep 5
          done
          curl -fsS -A "TheYard-SelfRead/1 (deploy)" --max-time 20 "$ORIGIN/api/facets" > /dev/null
          echo
          # Which store it came up on, said out loud. A warning and not a
          # failure, for the reason Deploy gives: the fallback serving is the
          # design working, and it must not be silent.
          store=$(curl -fsS -A "TheYard-SelfRead/1 (deploy)" --max-time 30 "$ORIGIN/api/health" || true)
          case "$store" in
            *"Azure Cosmos DB"*) echo "the site is on Azure Cosmos DB" ;;
            *) echo "::warning::this roll is not serving from Azure Cosmos DB: $store" ;;
          esac
          curl -sS --max-time 40 "$ORIGIN/api/admin/metrics" | head -c 2000 || true
          echo
          {
            echo "## Rolled $APP to $APP_VERSION"
            echo "- image: $IMAGE"
            echo "- origin: $ORIGIN"
          } >> "$GITHUB_STEP_SUMMARY"
      # #endregion verify-cosmos
      # #region warm-edge
      # Every deploy renames every hashed file, so the first visitor after it
      # would pay the edge's miss on every chunk they open (ADR: Cache headers,
      # addendum of 28 September). This asks the public address, not the origin,
      # for every file the build serves and for the Admin tab's public reads,
      # once each, as the site reading itself. A failure is a warning and never
      # fails the deploy.
      - name: Warm the edge
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'roll'
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/warm-edge.mjs "$SITE" deploy
      # #endregion warm-edge

