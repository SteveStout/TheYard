# Deploy: the continuous delivery leg (ADR-009).
# Fires when CI finishes green on main, builds the image with the two footer
# build arguments, pushes it to the registry, rewrites infra/aci-theyard.yaml
# to the new tag and rolls the container group. Auth is OIDC: GitHub holds
# three identifiers as repository variables and no secret exists anywhere.
name: Deploy

# #region deploy-trigger
# Deploy fires only when CI has already gone green on main, never on a push
# directly. workflow_run gives that ordering for free, and the job below checks
# the conclusion, because the event fires on failure too.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

# Two quick merges must not fight over the one container group.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on red CI too; this gate is what keeps a red run from
    # shipping. The run counter still ticks, so displayed versions may skip.
    if: github.event.workflow_run.conclusion == 'success'
    # #endregion deploy-trigger
    runs-on: ubuntu-latest
    # A hung roll must not hold the deploy-production group for the default six hours (ADR-017).
    timeout-minutes: 30
    env:
      REGISTRY_NAME: crtheyardsszmnetj67bn5h2
      ACR: crtheyardsszmnetj67bn5h2.azurecr.io
      RG: RG-THEYARD-SS
      ORIGIN: http://theyard-ss-zmnetj67bn5h2.westus2.azurecontainer.io:8080
      SITE: https://theyard.stevenstout.biz
      # The Application Insights component this deploy reads the connection
      # string from. The name is not a secret; the string it returns is.
      AI_NAME: appi-theyard-ss
      # Azure SQL Database (ADR: The SQL Server backend). None of these three is
      # a secret, and neither is the connection string built from them: the
      # server has no SQL login at all, so the container authenticates as the
      # managed identity it already carries and there is no password to hold.
      SQL_SERVER: sql-theyard-ss-westus3
      SQL_DB: sqldb-theyard-ss
      MI_CLIENT_ID: 2888a6ca-be1c-46a5-a1de-c666b1d193e5
    steps:
      # #region compute-version
      # Pin to the exact commit CI tested, not wherever main has moved since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The changelog's top line is the version (ADR-031). Not a run
          # counter: a counter ticks on runs that are gated off and never ship,
          # which is how 1.0.0.39 became a number the changelog named and
          # nothing ever displayed.
          VERSIONS=$(sed -n 's/^- \*\*1\.0\.0\.\([0-9][0-9]*\)\*\*.*/\1/p' docs/CHANGELOG.md)
          N=$(echo "$VERSIONS" | sed -n 1p)
          PREV=$(echo "$VERSIONS" | sed -n 2p)
          # #region changelog-check
          # Both of these used to be a warning nobody reads. They stop the
          # deploy now, because the file they check is where the version comes
          # from: shipping past either one means shipping a number with no
          # sentence attached to it (ADR-031).
          if [ -z "$N" ]; then
            echo "::error file=docs/CHANGELOG.md::No 1.0.0.N line at the top of the changelog, so there is no version to ship"
            exit 1
          fi
          if [ -n "$PREV" ] && [ "$N" -le "$PREV" ]; then
            echo "::error file=docs/CHANGELOG.md::The top line is 1.0.0.$N and 1.0.0.$PREV is already below it, so this ship has no changelog line of its own"
            exit 1
          fi
          # #endregion changelog-check
          {
            echo "N=$N"
            echo "APP_VERSION=1.0.0.$N"
            echo "APP_COMMIT=${HEAD_SHA:0:7}"
            echo "IMAGE=$ACR/theyard:v$N"
          } >> "$GITHUB_ENV"
          echo "Deploying 1.0.0.$N from ${HEAD_SHA:0:7} as $ACR/theyard:v$N"
      # #endregion compute-version

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push
        run: |
          az acr login --name "$REGISTRY_NAME"
          docker build \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg APP_COMMIT="$APP_COMMIT" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      # #region roll
      # The image tag is the only thing that changes between rolls, so the
      # template is rewritten by one sed and then checked before Azure sees it.
      # A silent no-match would redeploy the previous image and look like a
      # success.
      - name: Roll the container group
        run: |
          # Only the value line is rewritten; the header comment keeps its placeholder text.
          sed "s|^\(\s*image: \)__IMAGE__$|\1$IMAGE|" infra/aci-theyard.yaml > "$RUNNER_TEMP/aci.yaml"
          grep -q "^\s*image: $IMAGE$" "$RUNNER_TEMP/aci.yaml"
          # The Application Insights connection string is an ingestion key, so it
          # lives only in Azure: read it here with the credential this job already
          # holds, mask it in the log, and substitute it in python rather than sed
          # because the value carries characters a shell would treat as syntax.
          # az resource show is core CLI; az monitor app-insights would pull an
          # extension at run time, which is a second thing that can fail a deploy.
          # Telemetry is an addition, not a dependency. If the read fails, the
          # placeholder stays, the app reads anything starting with __ as "no
          # telemetry", and the site still ships: a deploy pipeline held hostage
          # to its own observability is worse than a quiet hour of no traces.
          CONN=$(az resource show -g "$RG" -n "$AI_NAME" \
            --resource-type "Microsoft.Insights/components" \
            --query "properties.ConnectionString" -o tsv 2>/dev/null || true)
          if [ -z "$CONN" ]; then
            echo "::warning::Application Insights was unreadable; this roll ships with telemetry off"
            CONN="__APPINSIGHTS_CONNECTION_STRING__"
          else
            echo "::add-mask::$CONN"
          fi
          CONN="$CONN" python3 - "$RUNNER_TEMP/aci.yaml" <<'PY'
          import os, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          placeholder = "__APPINSIGHTS_CONNECTION_STRING__"
          if placeholder not in text:
              sys.exit("the connection string placeholder is missing from the container spec")
          open(path, "w", encoding="utf-8").write(text.replace(placeholder, os.environ["CONN"]))
          PY
          # The database, by the same rule and for the same reason. The value
          # substituted here names a server, a database and an authentication
          # mode; the credential is the container's managed identity, which
          # never leaves Azure.
          #
          # The name is composed rather than read back from Azure. The first
          # version of this asked `az sql server show` for the fully qualified
          # name, which this job's identity is not allowed to do: it holds
          # Container Instances Contributor, AcrPush and Managed Identity
          # Operator, and no reader role. The call failed silently under
          # `|| true`, the placeholder survived, and 1.0.0.49 shipped on SQLite
          # and said so, which is the fallback working and is also a whole
          # release spent on a lookup that was never needed. An Azure SQL
          # logical server's address is its name plus the service suffix. It is
          # not a secret and it does not need a permission.
          if [ -z "$SQL_SERVER" ]; then
            echo "::warning::no SQL server is configured; this roll ships on SQLite"
            YARD_SQL="__YARD_SQL_CONNECTION__"
          else
            SQL_FQDN="${SQL_SERVER}.database.windows.net"
            YARD_SQL="Server=tcp:${SQL_FQDN},1433;Initial Catalog=${SQL_DB};Encrypt=True;TrustServerCertificate=False;Connect Timeout=30;Authentication=Active Directory Managed Identity;User Id=${MI_CLIENT_ID};"
          fi
          YARD_SQL="$YARD_SQL" python3 - "$RUNNER_TEMP/aci.yaml" <<'PY'
          import os, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          placeholder = "__YARD_SQL_CONNECTION__"
          if placeholder not in text:
              sys.exit("the database placeholder is missing from the container spec")
          open(path, "w", encoding="utf-8").write(text.replace(placeholder, os.environ["YARD_SQL"]))
          PY
          if [ "$YARD_SQL" = "__YARD_SQL_CONNECTION__" ]; then
            echo "the container spec keeps its database placeholder: this roll uses SQLite"
          else
            echo "the container spec points at $SQL_FQDN as the managed identity"
          fi
          if [ "$CONN" = "__APPINSIGHTS_CONNECTION_STRING__" ]; then
            echo "the container spec keeps its placeholder: telemetry is off for this roll"
          elif grep -q "__APPINSIGHTS_CONNECTION_STRING__" "$RUNNER_TEMP/aci.yaml"; then
            echo "the placeholder survived the substitution"
            exit 1
          else
            echo "the container spec carries the connection string (value masked)"
          fi
          az container create -g "$RG" -f "$RUNNER_TEMP/aci.yaml" \
            --query "{state:provisioningState,image:containers[0].image,fqdn:ipAddress.fqdn}" -o json

      # #endregion roll
      # #region verify
      # A deploy is not done when Azure returns; it is done when the new build
      # answers. This waits for the version it just built, at the origin and then
      # at the domain, and fails the run if it never appears, so a bad roll
      # cannot be reported as a good one.
      - name: Verify
        run: |
          # The roll restarts the group: wait for the NEW build to answer at the origin.
          for i in $(seq 1 30); do
            sleep 10
            body=$(curl -fsS --max-time 10 "$ORIGIN/api/version" || true)
            if [[ "$body" == *"\"$APP_VERSION\""* ]]; then
              echo "origin serves $APP_VERSION after $((i * 10))s: $body"
              break
            fi
            if [[ "$i" -eq 30 ]]; then
              echo "origin never served $APP_VERSION (last answer: $body)"
              exit 1
            fi
          done
          curl -fsS --max-time 20 "$ORIGIN/api/facets" > /dev/null
          # Readiness is the container's own word that its files are in place (ADR-010).
          curl -fsS --max-time 20 "$ORIGIN/readyz"
          echo
          # The domain is the edge in front of the same origin: what a visitor sees.
          site=$(curl -fsS --max-time 30 "$SITE/api/version")
          echo "domain: $site"
          if [[ "$site" != *"\"$APP_VERSION\""* || "$site" != *"\"$APP_COMMIT\""* ]]; then
            echo "domain does not report $APP_VERSION at $APP_COMMIT"
            exit 1
          fi
          curl -fsS --max-time 30 "$SITE/api/facets" > /dev/null
          # Which store the container actually came up on, said out loud.
          #
          # A warning and not a failure, on purpose. The whole point of the
          # file-backed fallback is that the site serves when the database does
          # not (ADR: The relational store), so a roll that lands on SQLite is
          # the design working and must not fail a deploy. What it must not be
          # is silent: 1.0.0.49 shipped that way and nothing said so until
          # somebody read the health endpoint by hand.
          store=$(curl -fsS --max-time 30 "$SITE/api/health" || true)
          case "$store" in
            *"Azure SQL Database"*) echo "the container is on Azure SQL Database" ;;
            *SQLite*) echo "::warning::this roll is serving from SQLite, not Azure SQL Database" ;;
            *) echo "::warning::could not tell which store the container is on" ;;
          esac
          # Azure's own view of the container (the Admin tab's card), informational.
          curl -sS --max-time 40 "$SITE/api/admin/azure" || true
          echo
          {
            echo "## Deployed 1.0.0.$N"
            echo "- commit: $APP_COMMIT"
            echo "- image: $IMAGE"
            echo "- site: $SITE"
          } >> "$GITHUB_STEP_SUMMARY"
      # #endregion verify
