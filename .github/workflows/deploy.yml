# Deploy: the continuous delivery leg (ADR-009).
# Fires on a push to main, which only the ship's gate makes once every suite
# has passed on both stores (ADR: The five-minute gate, addendum of 21
# September: every check runs once). It builds the image with the two footer
# build arguments, pushes it to the registry and rolls the first site's web app
# to the new tag (ADR: One plan, two sites). Auth is OIDC: GitHub holds three
# identifiers as repository variables and two secrets, the session signing key
# and the operator's key, which the roll hands to the site (ADR: Three readers
# with no memory of the project).
name: Deploy

# #region deploy-trigger
# Deploy fires on the push itself. Until 1.0.0.173 it waited for CI to run
# every suite again on GitHub's runners, four and a half minutes spent proving
# what the gate had proven a minute earlier on both stores; Steve's rule is
# that every check runs once, and the one run is the gate, which is the only
# thing that pushes to main (ADR: The five-minute gate, addendum of 21
# September). CI still runs every suite on a pull request.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# Two quick merges must not fight over the one site.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # #endregion deploy-trigger
    runs-on: ubuntu-latest
    # A hung roll must not hold the deploy-production group for the default six hours (ADR-017).
    timeout-minutes: 30
    env:
      REGISTRY_NAME: crtheyardsszmnetj67bn5h2
      ACR: crtheyardsszmnetj67bn5h2.azurecr.io
      RG: RG-THEYARD-SS
      # The first site's web app on the plan both sites share, its own address,
      # and the public name the edge sends to it (ADR: One plan, two sites).
      APP: APP-THEYARD-SS-ZMNETJ67BN5H2
      ORIGIN: https://app-theyard-ss-zmnetj67bn5h2.azurewebsites.net
      SITE: https://theyard.stevenstout.biz
      # The Application Insights component this deploy reads the connection
      # string from. The name is not a secret; the string it returns is.
      AI_NAME: appi-theyard-ss
      # Azure SQL Database (ADR: The SQL Server backend). None of these three is
      # a secret, and neither is the connection string built from them: the
      # server has no SQL login at all, so the container authenticates as the
      # managed identity it already carries and there is no password to hold.
      SQL_SERVER: sql-theyard-ss-westus3
      # sqldb-theyard-ss-basic since 1.0.0.128: the serverless free database beside it
      # spent September's allowance on the fourteenth and is paused until October
      # (ADR: The SQL Server backend, addendum of 14 September).
      SQL_DB: sqldb-theyard-ss-basic
      MI_CLIENT_ID: 2888a6ca-be1c-46a5-a1de-c666b1d193e5
    steps:
      # #region compute-version
      # Pin to the exact commit the gate tested and pushed, not wherever main has moved since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Compute version
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          # The changelog's top line is the version (ADR-031). Not a run
          # counter: a counter ticks on runs that are gated off and never ship,
          # which is how 1.0.0.39 became a number the changelog named and
          # nothing ever displayed.
          VERSIONS=$(sed -n 's/^- \*\*1\.0\.0\.\([0-9][0-9]*\)\*\*.*/\1/p' docs/CHANGELOG.md)
          N=$(echo "$VERSIONS" | sed -n 1p)
          PREV=$(echo "$VERSIONS" | sed -n 2p)
          # #region changelog-check
          # Both of these used to be a warning nobody reads. They stop the
          # deploy now, because the file they check is where the version comes
          # from: shipping past either one means shipping a number with no
          # sentence attached to it (ADR-031).
          if [ -z "$N" ]; then
            echo "::error file=docs/CHANGELOG.md::No 1.0.0.N line at the top of the changelog, so there is no version to ship"
            exit 1
          fi
          if [ -n "$PREV" ] && [ "$N" -le "$PREV" ]; then
            echo "::error file=docs/CHANGELOG.md::The top line is 1.0.0.$N and 1.0.0.$PREV is already below it, so this ship has no changelog line of its own"
            exit 1
          fi
          # #endregion changelog-check
          {
            echo "N=$N"
            echo "APP_VERSION=1.0.0.$N"
            echo "APP_COMMIT=${HEAD_SHA:0:7}"
            echo "IMAGE=$ACR/theyard:v$N"
          } >> "$GITHUB_ENV"
          echo "Deploying 1.0.0.$N from ${HEAD_SHA:0:7} as $ACR/theyard:v$N"
      # #endregion compute-version

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # #region build-cache
      # The image's slow layers (npm ci, dotnet restore, the publish) are kept
      # in GitHub's own build cache between runs, not in the registry, so a
      # version whose packages did not change skips them and the registry holds
      # nothing but the images themselves (ADR-009, addendum of 21 September).
      - name: Sign in to the registry
        run: az acr login --name "$REGISTRY_NAME"

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_COMMIT=${{ env.APP_COMMIT }}
          cache-from: type=gha,scope=theyard
          cache-to: type=gha,scope=theyard,mode=max
          provenance: false
      # #endregion build-cache

      # #region roll
      # A web app's settings live on the web app, so a roll is two calls: the
      # four values the template does not hold, then the image
      # (ADR: One plan, two sites). Both answer with -o none, because the first
      # would otherwise print every setting the site holds into this log. The
      # plan, the sites and every other setting are infra/appservice.bicep, and
      # a roll changes none of them.
      - name: Roll the site
        env:
          YARD_AUTH_SIGNING_KEY: ${{ secrets.YARD_AUTH_SIGNING_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          # The Application Insights connection string is an ingestion key, so it
          # lives only in Azure: read it here with the credential this job already
          # holds and mask it in the log. az resource show is core CLI; az monitor
          # app-insights would pull an extension at run time, which is a second
          # thing that can fail a deploy. Telemetry is an addition, not a
          # dependency: if the read fails, the site keeps the value it has and
          # still ships, because a deploy pipeline held hostage to its own
          # observability is worse than a quiet hour of no traces.
          CONN=$(az resource show -g "$RG" -n "$AI_NAME" \
            --resource-type "Microsoft.Insights/components" \
            --query "properties.ConnectionString" -o tsv 2>/dev/null || true)
          if [ -n "$CONN" ]; then
            echo "::add-mask::$CONN"
          fi
          # The database. The value names a server, a database and an
          # authentication mode; the credential is the site's managed identity,
          # which never leaves Azure. The name is composed rather than read back
          # from Azure: the first version of this asked `az sql server show`,
          # which this job's identity is not allowed to do, the call failed
          # silently, and 1.0.0.49 shipped on SQLite and said so. An Azure SQL
          # logical server's address is its name plus the service suffix. No
          # Connect Timeout, on purpose: YardConnection widens a timeout nobody
          # gave to sixty seconds, and a value given here wins over that
          # (ADR: The SQL Server backend).
          YARD_SQL=""
          if [ -n "$SQL_SERVER" ]; then
            YARD_SQL="Server=tcp:${SQL_SERVER}.database.windows.net,1433;Initial Catalog=${SQL_DB};Encrypt=True;TrustServerCertificate=False;Authentication=Active Directory Managed Identity;User Id=${MI_CLIENT_ID};"
          fi
          # #region secrets
          # The session signing key and the operator's key, from the repository
          # secrets of the same names, handed to the step through env and written
          # to a file by python, so neither is ever part of a command line and
          # neither appears in a log: GitHub masks them, and the settings call
          # prints nothing. A value this job does not hold is left out, and the
          # site keeps what it has: the template's placeholder on a new site,
          # which the app reads as "no key", or the last roll's value
          # (ADR: Three readers with no memory of the project; ADR: Site
          # activity, and the line an address does not cross).
          CONN="$CONN" YARD_SQL="$YARD_SQL" python3 - "$RUNNER_TEMP/settings.json" <<'PY'
          import json, os, sys
          wanted = {
              "APPLICATIONINSIGHTS_CONNECTION_STRING": os.environ.get("CONN", ""),
              "ConnectionStrings__YardSql": os.environ.get("YARD_SQL", ""),
              "Auth__SigningKey": os.environ.get("YARD_AUTH_SIGNING_KEY", ""),
              "Admin__Key": os.environ.get("ADMIN_KEY", ""),
          }
          held = [{"name": name, "value": value, "slotSetting": False} for name, value in wanted.items() if value]
          for name, value in wanted.items():
              if not value:
                  print(f"::warning::{name} is not held by this job; the site keeps the value it has")
          json.dump(held, open(sys.argv[1], "w", encoding="utf-8"))
          print(f"{len(held)} of {len(wanted)} values go to the site (values masked)")
          PY
          # #endregion secrets
          if [ "$(cat "$RUNNER_TEMP/settings.json")" != "[]" ]; then
            az webapp config appsettings set -g "$RG" -n "$APP" --settings "@$RUNNER_TEMP/settings.json" -o none
          fi
          rm -f "$RUNNER_TEMP/settings.json"
          # The image is the only thing that changes between rolls. App Service
          # starts the new container beside the old one and moves traffic when
          # the new one answers, so the site serves through its own roll.
          az webapp config set -g "$RG" -n "$APP" --linux-fx-version "DOCKER|$IMAGE" -o none
          az webapp show -g "$RG" -n "$APP" --query "{state:state, image:siteConfig.linuxFxVersion, host:defaultHostName}" -o json
      # #endregion roll
      # #region verify
      # A deploy is not done when Azure returns; it is done when the new build
      # answers. This waits for the version it just built, at the origin and then
      # at the domain, and fails the run if it never appears, so a bad roll
      # cannot be reported as a good one.
      - name: Verify
        run: |
          # Wait for the NEW build to answer at the origin. Ten minutes rather
          # than five: the plan is one shared processor, and the process reads a
          # hundred thousand vehicles into memory before it answers.
          for i in $(seq 1 60); do
            sleep 10
            body=$(curl -fsS --max-time 10 "$ORIGIN/api/version" || true)
            if [[ "$body" == *"\"$APP_VERSION\""* ]]; then
              echo "origin serves $APP_VERSION after $((i * 10))s: $body"
              break
            fi
            if [[ "$i" -eq 60 ]]; then
              echo "origin never served $APP_VERSION (last answer: $body)"
              exit 1
            fi
          done
          curl -fsS --max-time 20 "$ORIGIN/api/facets" > /dev/null
          # Readiness is the container's own word that its files are in place (ADR-010).
          curl -fsS --max-time 20 "$ORIGIN/readyz"
          echo
          # The domain is the edge in front of the same origin: what a visitor sees.
          site=$(curl -fsS --max-time 30 "$SITE/api/version")
          echo "domain: $site"
          if [[ "$site" != *"\"$APP_VERSION\""* || "$site" != *"\"$APP_COMMIT\""* ]]; then
            echo "domain does not report $APP_VERSION at $APP_COMMIT"
            exit 1
          fi
          curl -fsS --max-time 30 "$SITE/api/facets" > /dev/null
          # Which store the container actually came up on, said out loud.
          #
          # A warning and not a failure, on purpose. The whole point of the
          # file-backed fallback is that the site serves when the database does
          # not (ADR: The relational store), so a roll that lands on SQLite is
          # the design working and must not fail a deploy. What it must not be
          # is silent: 1.0.0.49 shipped that way and nothing said so until
          # somebody read the health endpoint by hand.
          store=$(curl -fsS --max-time 30 "$SITE/api/health" || true)
          case "$store" in
            *"Azure SQL Database"*) echo "the site is on Azure SQL Database" ;;
            *SQLite*) echo "::warning::this roll is serving from SQLite, not Azure SQL Database" ;;
            *) echo "::warning::could not tell which store the container is on" ;;
          esac
          # Azure's own view of the container (the Admin tab's card), informational.
          curl -sS --max-time 40 "$SITE/api/admin/azure" || true
          echo
          {
            echo "## Deployed 1.0.0.$N"
            echo "- commit: $APP_COMMIT"
            echo "- image: $IMAGE"
            echo "- site: $SITE"
          } >> "$GITHUB_STEP_SUMMARY"
      # #endregion verify

