name: Gate

# The ship's gate, on a GitHub runner instead of the laptop (ADR: The gate runs where the memory is).
#
# The laptop that ships has 8 GB and the suites need more than it has free with an editor open: a
# gate there waited hours for memory, and three takes timed out in specs the change did not touch.
# So a lane's machine now only builds its one commit and pushes it to a branch named ready/<lane>-<sha8>,
# with the version, date and record placeholders unfilled; this workflow runs every check the laptop's
# gate ran, in the same order, on a runner with 16 GB, on the commit the cop job fills. Red, main is
# never touched.
#
# Green, the run promotes itself (ADR: The gate runs where the memory is, the addendum of
# 1.0.4.101): the promote job writes data/test-results.json and the README's figures from the
# gate-raw artifact, folds them into the commit and fast-forwards main, and the push rolls the site,
# freeing the gate at live. The reads after the roll, both names and CI on main, are a run of their
# own, after-roll.yml, started by this run's end (ADR-098, the addendum on the gate freeing at live);
# the next promote's line-stop waits for both to be green. No machine has to be on. The gate job
# itself only reads. A ready branch names no version: the version is the one the cop's status gives
# it, and the old gate/<version>-<lane>-<sha8> names still read as the text after gate/ up to the
# first hyphen (scripts/versions.sh, branch_version) wherever an older run is read back.
#
# A version that changes a workflow is the one that needs more than the run's own token. With the
# secret PROMOTE_TOKEN it pushes itself, and because a personal token's push starts the workflows
# the run's own push would not, that push is the roll and the two deploy jobs skip. With no such
# secret the promote job ends GREEN with a notice and moves nothing, and a person promotes the run
# by hand: green code never sends a failure email (ADR-098, the addendum of 1.0.4.119).
#
# The traffic cop (ADR-137, One traffic cop for main): a lane never picks a version. It pushes
# ready/<lane>-<sha8>, one commit with the placeholders unfilled, and the cop job, run the moment this run
# holds the gate's group, rebases it onto main, fills the numbers (main's top line plus one) and hands the
# filled commit to every later job as a bundle; each job tests that commit. A branch that cannot be filled
# is skipped green with its reason posted on the branch's commit, and a run that lands posts "landed as
# <version>". gate/* is closed: main's gate.yml carries the ready/** trigger, so the cop refuses it red.
on:
  push:
    branches: ["gate/**", "ready/**"]

# Read the code; sign in to Azure for the Cosmos DB passes. Nothing else.
permissions:
  contents: read
  id-token: write

# One gate at a time: two would share the tests- containers on the Cosmos DB account. queue: max keeps every pending
# run in line (up to a hundred) instead of the default, which keeps one and cancels the run it replaces, so a third
# push can never cancel a pending gate in silence. A pending run is never cancelled for a running one either way, and
# GitHub refuses queue: max beside cancel-in-progress: true, so that line is left out (ADR-031, the addendum on the
# fill at the claim).
concurrency:
  group: gate
  queue: max

jobs:
  # The checks run side by side (ADR-098, the addendum of 1.0.5.4). Until 1.0.5.3 every check ran in one job, one
  # after another, and the run was the sum of its suites; ADR-068's addendum of 1.0.3.183 worked out that two jobs
  # would bring it under ten minutes and left it unbuilt. Now four kinds of job start together: the .NET side on
  # SQLite, everything that reads the Cosmos DB account (in ONE job, because two would share the tests- containers
  # on it), the node checks, and the browser suite on SQLite in two shards. Each leaves its reports as
  # raw-<job>-<attempt>, and the gate job folds them into the one gate-raw folder promote.sh and the
  # Admin tab read, in the shape they read before, and turns the run red or green with the same verdict. Every check
  # still runs, on the same cuts; only the order of the waiting changed.

  # #region cop-job
  # The traffic cop, run the moment this run holds the gate's group (ADR-137): the number is assigned here, inside
  # the group, one run at a time, so two branches pushed seconds apart land as N and N+1 whatever order GitHub starts
  # them in. scripts/cop.sh rebases a ready branch onto main, lifts its changelog line over main's, fills the version,
  # the date and the record number, and leaves the filled commit as a bundle in the filled artifact; a gate/* branch
  # takes the old number check until main carries the cop. Every job that costs minutes waits on this one and runs
  # only when it says go. A skip tested nothing, so it ends green, and the reason goes on the branch's commit as a
  # failing status the lane reads.
  cop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    outputs:
      landed: ${{ steps.cop.outputs.landed }}
      reason: ${{ steps.cop.outputs.reason }}
      version: ${{ steps.cop.outputs.version }}
      sha: ${{ steps.cop.outputs.sha }}
      ready: ${{ steps.cop.outputs.ready }}
      base: ${{ steps.cop.outputs.base }}
      workflow: ${{ steps.cop.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The fill redraws the version card (docs/images/og.mjs, on the runner's own Chrome) and measures the ratchet
      # (python3 .github/quality.py), so a ready branch needs node and the packages; a gate/* branch arrives filled.
      - uses: actions/setup-node@v7
        if: startsWith(github.ref_name, 'ready/')
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: startsWith(github.ref_name, 'ready/')
      - name: The cop
        id: cop
        env:
          # Whether the secret exists, never its value.
          HAS_PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN != '' }}
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          bash scripts/cop.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/filled"
      - uses: actions/upload-artifact@v7
        if: steps.cop.outputs.landed == 'go'
        with:
          name: filled
          path: ${{ runner.temp }}/filled/
      - name: The skip, said on the branch's commit
        if: steps.cop.outputs.landed == 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.cop.outputs.reason }}
        run: |
          bash scripts/cop_status.sh "$GITHUB_SHA" failure "skipped: $REASON"
  # #endregion cop-job

  # #region dotnet-job
  # The .NET side on SQLite: the build with any warning red, dotnet format, the SQL projects, the job hunt's
  # Function's suite, the machine lanes' suite and xUnit on SQLite.
  dotnet:
    needs: cop
    if: needs.cop.outputs.landed == 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/filled
        with:
          sha: ${{ needs.cop.outputs.sha }}
          base: ${{ needs.cop.outputs.base }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/dotnet
      - run: npm ci
      - name: What the branch changed
        run: |
          mkdir -p "$RUNNER_TEMP/raw/trx"
          echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          bash scripts/gate_cuts.sh "$RUNNER_TEMP/raw"

      # #region version-card
      # The link preview card names the version, so it is drawn here from the commit's own changelog
      # before any test reads it, and leaves in gate-raw for promote to fold into the commit with the
      # results: a ship needs no machine to draw it first (ADR-098, the addendum of 1.0.4.105). The
      # runner image's own Chrome draws it.
      - name: The version card
        run: |
          node docs/images/og.mjs
          python3 scripts/strip_c2pa.py docs/images
          cp docs/images/og.svg public/og.png "$RAW/"
          git status --short -- docs/images/og.svg public/og.png
      # #endregion version-card

      # #region build
      # Any build warning is red, as on the laptop.
      - name: dotnet build
        id: build
        run: |
          set -o pipefail
          dotnet build api/TheYard.slnx -c Debug 2>&1 | tee "$RAW/build.txt"
          warnings=$(grep -c ': warning ' "$RAW/build.txt" || true)
          echo "build warnings: $warnings"
          echo "warnings=$warnings" > "$RAW/build.result"
      # #endregion build

      # #region dotnet-side
      # The .NET side: format, the SQL project, the two other processes' suites and xUnit on SQLite.
      - name: The .NET side
        if: always()
        run: |
          r="$RAW/dotnet.result"; : > "$r"
          t() { local s=$SECONDS code=0; "$@" || code=$?; echo "$code $((SECONDS - s))"; }
          if [ "$FORMAT_NEEDED" = 1 ]; then
            read code s < <(t bash -c 'dotnet format api/TheYard.slnx --verify-no-changes --no-restore > "$RAW/format.txt" 2>&1 && dotnet format server/JobHunt.Server.slnx --verify-no-changes >> "$RAW/format.txt" 2>&1')
            echo "format=$code" >> "$r"; echo "format_s=$s" >> "$r"
          else echo "format=skipped" >> "$r"; echo "format_s=0" >> "$r"; fi
          read code s < <(t bash -c 'dotnet build api/TheYard.Database/TheYard.Database.sqlproj -c Debug > "$RAW/sqlproj.txt" 2>&1 && dotnet build functions/JobHunt.Database/JobHunt.Database.sqlproj -c Debug >> "$RAW/sqlproj.txt" 2>&1')
          echo "sqlproj=$code" >> "$r"; echo "sqlproj_s=$s" >> "$r"
          # The job hunt's Function's own suite, so a version that breaks it never reaches main.
          read code s < <(t bash -c 'dotnet test functions/jobhunt.Tests > "$RAW/functions.txt" 2>&1')
          echo "functions=$code" >> "$r"; echo "functions_s=$s" >> "$r"
          # The machine lanes' own suite, the third process (ADR-119, the addendum on the third process).
          read code s < <(t bash -c 'dotnet test server/JobHunt.Server.Tests > "$RAW/server.txt" 2>&1')
          echo "server=$code" >> "$r"; echo "server_s=$s" >> "$r"
          read code s < <(t bash -c 'dotnet test api --no-build --filter "Store!=cosmos" --logger "trx;LogFileName=xunit-sqlite.trx" --results-directory "$RAW/trx" > "$RAW/xunit-sqlite.txt" 2>&1')
          echo "xunit=$code" >> "$r"; echo "xunit_s=$s" >> "$r"
          cat "$r"
      # #endregion dotnet-side

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-dotnet-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw/
      - name: This job's verdict
        if: always()
        run: bash scripts/gate_job.sh "$RAW" warnings format sqlproj functions server xunit
  # #endregion dotnet-job

  # #region cosmos-job
  # Everything that reads the Cosmos DB account, in this one job and one pass after another: the live Cosmos DB
  # tests on every run, and, when the commit touched what they read, the whole xUnit suite booted on Cosmos DB and
  # the three store specs in the browser. The live tests, xUnit on Cosmos DB and the browser pass on Cosmos DB share
  # the account, and the last two the tests- containers on it, so they are never split across jobs. This is the one
  # job that signs in to Azure: a sign-in that times out reddens this job's passes and nothing else.
  cosmos:
    needs: cop
    if: needs.cop.outputs.landed == 'go'
    runs-on: ubuntu-24.04
    # The federated credential for the one read of the account is issued to this environment, so a
    # branch name never has to be registered in Azure.
    environment: gate
    timeout-minutes: 30
    # Every Cosmos DB pass runs on the Azure Cosmos DB emulator beside the job, never on the account
    # the sites read, but for one read: a test writes into a database thrown away with the runner,
    # so nothing a test does outlives it and no pass can throttle the live sites (ADR-098, the addendum of 1.0.5.94).
    services:
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
        ports:
          - 8081:8081
        env:
          ENABLE_TELEMETRY: "false"
    env:
      COSMOS_ENDPOINT: http://localhost:8081/
      COSMOS_ACCOUNT: https://cosmos-theyard-ss.documents.azure.com:443/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/filled
        with:
          sha: ${{ needs.cop.outputs.sha }}
          base: ${{ needs.cop.outputs.base }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/dotnet
      - run: npm ci
      - name: What the branch changed
        run: |
          mkdir -p "$RUNNER_TEMP/raw/trx"
          echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          bash scripts/gate_cuts.sh "$RUNNER_TEMP/raw"
      # The suite booted on Cosmos DB reads the card as the SQLite pass does.
      - name: The version card, for the suite to read
        run: |
          node docs/images/og.mjs
          python3 scripts/strip_c2pa.py docs/images
      # The one read of the account itself: the keyset test asks the live catalogue what a deep page
      # costs in request units, which the emulator does not report. It only reads. A login that fails
      # does not stop the run here: that test then fails on its own, by name.
      - uses: azure/login@v3
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The database and the eight tests- containers the suite was written against, each shaped as its
      # infra/cosmos file says; no catalogue, which the experiment card's empty state reads.
      - name: The emulator's containers
        run: node scripts/cosmos_emulator.mjs "$COSMOS_ENDPOINT" tests- activity,bids,logs,machines,photos,resets,users,vehicles
      # The build's warnings are judged in the dotnet job; this build only has to be there for the passes.
      - name: dotnet build, for the passes
        run: dotnet build api/TheYard.slnx -c Debug > "$RAW/cosmos-build.txt" 2>&1 || { tail -n 20 "$RAW/cosmos-build.txt"; exit 1; }
      - name: The bundle and Chrome, for the store specs
        if: env.COSMOS_NEEDED == '1'
        run: |
          # When Ubuntu's mirror cannot be reached the install fails on the system fonts alone; the runner's own Chrome
          # runs the suite then, and the run says so (ADR-098, the addendum of 1.0.5.19).
          npx playwright install --with-deps chrome || { test -x /opt/google/chrome/chrome && echo "::warning::the Chrome install could not fetch its system packages; the runner's own Chrome runs the suite"; }
          npx vite build

      # #region both-stores
      # The same xUnit suite again, booted on Cosmos DB: the process pointed at the emulator and the
      # tests- containers, when the commit touched what it reads; between the store tests that drive
      # the adapters directly and the three store specs in the browser.
      - name: The Cosmos DB passes
        if: always()
        run: |
          d="$RAW/dotnet.result"; n="$RAW/node.result"; : > "$d"; : > "$n"
          t() { local s=$SECONDS code=0; "$@" || code=$?; echo "$code $((SECONDS - s))"; }
          export Cosmos__AccountEndpoint="$COSMOS_ENDPOINT" Cosmos__Credential=emulator
          read code s < <(t env Cosmos__CatalogueAccountEndpoint="$COSMOS_ACCOUNT" bash -c 'dotnet test api --no-build --filter "Store=cosmos" --logger "trx;LogFileName=xunit-live.trx" --results-directory "$RAW/trx" > "$RAW/xunit-live.txt" 2>&1')
          echo "live=$code" >> "$d"; echo "live_s=$s" >> "$d"
          export Cosmos__ContainerPrefix="tests-"
          if [ "$COSMOS_NEEDED" = 1 ]; then
            read code s < <(t bash -c 'dotnet test api --no-build --filter "Store!=cosmos" --logger "trx;LogFileName=xunit-cosmos.trx" --results-directory "$RAW/trx" > "$RAW/xunit-cosmos.txt" 2>&1')
            echo "oncosmos=$code" >> "$d"; echo "oncosmos_s=$s" >> "$d"
          else echo "oncosmos=skipped" >> "$d"; echo "oncosmos_s=0" >> "$d"; fi
          export YARD_API_PREBUILT=1 YARD_WEB_PREVIEW=1
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$RAW/browser-cosmos.json" PLAYWRIGHT_JSON_OUTPUT_NAME="$RAW/browser-cosmos.json"
          if [ "$COSMOS_NEEDED" = 1 ]; then
            read code s < <(t bash -c 'npx playwright test tests/e2e/store-toggle.spec.ts tests/e2e/account.spec.ts tests/e2e/admin.spec.ts --workers=2 --retries=1 --reporter=list,json > "$RAW/browser-cosmos.txt" 2>&1')
            echo "browser_cosmos=$code" >> "$n"; echo "browser_cosmos_s=$s" >> "$n"
          else echo "browser_cosmos=skipped" >> "$n"; echo "browser_cosmos_s=0" >> "$n"; fi
          for port in 5173 5210; do fuser -k "$port/tcp" 2>/dev/null || true; done
          cat "$d" "$n"
      # #endregion both-stores

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-cosmos-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw/
      - name: This job's verdict
        if: always()
        run: bash scripts/gate_job.sh "$RAW" live oncosmos browser_cosmos
  # #endregion cosmos-job

  # #region node-job
  # The node checks: the two bundles and the code's own numbers, Prettier, oxlint, the type check, Vitest, the em
  # dash scan and the quality ratchet.
  node:
    needs: cop
    if: needs.cop.outputs.landed == 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/filled
        with:
          sha: ${{ needs.cop.outputs.sha }}
          base: ${{ needs.cop.outputs.base }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/dotnet
      - run: npm ci
      - run: mkdir -p "$RUNNER_TEMP/raw" && echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
      - run: npx vite build
        id: web
      - run: npx vite build --config render/vite.config.ts

      # #region code-numbers
      # The code's own numbers for CODE HEALTH on the tests card: the page's built size and the
      # packages with a newer release. Measurements, not checks: nothing here turns the run red
      # (the build's warnings already do, in the dotnet job), so they go to their own file,
      # code.result. They run only after the page's build passed: a size read off a failed build
      # would say 0 kB, and the card must say not measured instead (ADR-080).
      - name: The code's own numbers
        if: always() && steps.web.outcome == 'success'
        run: |
          echo "dist_js_bytes=$(cat dist/assets/*.js | wc -c)" >> "$RAW/code.result"
          echo "dist_css_bytes=$(cat dist/assets/*.css | wc -c)" >> "$RAW/code.result"
          npm outdated --json > "$RAW/npm-outdated.json" 2>/dev/null || true
          echo "outdated_npm=$(node -e 'try{console.log(Object.keys(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")||"{}")).length)}catch{console.log(-1)}' "$RAW/npm-outdated.json")" >> "$RAW/code.result"
          echo "outdated_nuget=$( (dotnet list api/TheYard.slnx package --outdated 2>/dev/null || true) | grep -cE '^\s+> ' || true)" >> "$RAW/code.result"
          cat "$RAW/code.result"
      # #endregion code-numbers

      # #region node-side
      # The node side: Prettier, oxlint, the type check and Vitest. The browser suite is the browser job's.
      - name: The node side
        if: always()
        run: |
          r="$RAW/node.result"; : > "$r"
          t() { local s=$SECONDS code=0; "$@" || code=$?; echo "$code $((SECONDS - s))"; }
          read code s < <(t bash -c 'npm run format:check > "$RAW/prettier.txt" 2>&1')
          echo "prettier=$code" >> "$r"; echo "prettier_s=$s" >> "$r"
          read code s < <(t bash -c 'npm run lint > "$RAW/lint.txt" 2>&1')
          echo "lint=$code" >> "$r"; echo "lint_s=$s" >> "$r"
          read code s < <(t bash -c 'npx tsc -b > "$RAW/tsc.txt" 2>&1')
          echo "tsc=$code" >> "$r"; echo "tsc_s=$s" >> "$r"
          read code s < <(t bash -c 'npx vitest run --reporter=default --reporter=json --outputFile.json="$RAW/vitest.json" > "$RAW/vitest.txt" 2>&1')
          echo "vitest=$code" >> "$r"; echo "vitest_s=$s" >> "$r"
          cat "$r"
      # #endregion node-side

      # #region em-dashes
      # The house rule on em dashes, over every text file: the one script preflight's catch list runs too, so the
      # check a lane runs before its claim is this one (ADR-098, the addendum on the catch list). Its exit code is
      # the result, 0 for none.
      - name: The em dash scan
        if: always()
        run: |
          r="$RAW/rest.result"; : > "$r"
          code=0
          bash scripts/emdash_scan.sh > "$RAW/emdash.txt" 2>&1 || code=$?
          echo "emdash=$code" >> "$r"
          cat "$RAW/emdash.txt" "$r"
      # #endregion em-dashes

      # #region heal-outside
      # The outside self-heal list (the year-end plan's 7b): on a ready/heal-* branch, a path in data/heal-outside.json
      # or a deleted file is red, and this job's verdict names it; any other branch is not a heal and passes. The one
      # script the catch list runs too. It reads the lane's own commit, the cop's ready output, before the fill: the
      # changelog, the counts and the ratchet the fill writes for every version are the cop's, never the heal's, and a
      # heal's required test raises the xUnit floor the fill moves. Preflight already runs on the unfilled commit.
      - name: The heal-outside list
        if: always()
        env:
          BASE: ${{ needs.cop.outputs.base }}
          READY: ${{ needs.cop.outputs.ready }}
        run: |
          r="$RAW/rest.result"
          code=0
          # The checkout holds the pushed commit; a missing one is fetched, and one that cannot be read is red.
          [ -z "$READY" ] || git cat-file -e "$READY^{commit}" 2> /dev/null || git fetch -q origin "$READY" || true
          python3 scripts/heal_outside.py --branch "$GITHUB_REF_NAME" --base "${BASE:-origin/main}" --head "${READY:-HEAD}" > "$RAW/heal-outside.txt" 2>&1 || code=$?
          echo "healoutside=$code" >> "$r"
          cat "$RAW/heal-outside.txt"
      # #endregion heal-outside

      # #region quality-ratchet
      # The quality ratchet, the same command CI runs, so a version cannot reach main with
      # any of its numbers worse than the file says (ADR: The numbers that may only fall).
      # It reads the checkout and builds nothing, so it costs seconds. The script is the one
      # the catch list runs. Its result joins rest.result, which the verdict reads.
      - name: The quality ratchet
        if: always()
        run: |
          r="$RAW/rest.result"
          code=0
          bash scripts/quality_ratchet.sh > "$RAW/quality.txt" 2>&1 || code=$?
          echo "quality=$code" >> "$r"
          cat "$RAW/quality.txt"
      # #endregion quality-ratchet

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-node-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw/
      - name: This job's verdict
        if: always()
        run: bash scripts/gate_job.sh "$RAW" prettier lint tsc vitest emdash quality healoutside
  # #endregion node-job

  # #region browser-job
  # The browser suite on SQLite against the bundle just built, with the rendering service in front of it, in two
  # shards that split it by spec file. The gate job folds the two shards' reports into the one result the site
  # reads, and a pass that needed its retry is still written r (ADR-068, the addendum of 1.0.4.24).
  browser:
    name: browser ${{ matrix.shard }} of 2
    needs: cop
    if: needs.cop.outputs.landed == 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/filled
        with:
          sha: ${{ needs.cop.outputs.sha }}
          base: ${{ needs.cop.outputs.base }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/dotnet
      - run: npm ci
      # Ubuntu's mirror out of reach fails the install on the system fonts alone; the runner's own Chrome runs the suite then (ADR-098, the addendum of 1.0.5.19).
      - run: npx playwright install --with-deps chrome || { test -x /opt/google/chrome/chrome && echo "::warning::the Chrome install could not fetch its system packages; the runner's own Chrome runs the suite"; }
      - run: mkdir -p "$RUNNER_TEMP/raw" && echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
      # The API and the two bundles the suite serves; the build's warnings are the dotnet job's to judge.
      - run: dotnet build api/TheYard.Api -c Debug > "$RAW/api-build.txt" 2>&1 || { tail -n 20 "$RAW/api-build.txt"; exit 1; }
      - run: npx vite build
      - run: npx vite build --config render/vite.config.ts
      - name: The browser suite on SQLite, one shard
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          r="$RAW/node.result"; : > "$r"
          t() { local s=$SECONDS code=0; "$@" || code=$?; echo "$code $((SECONDS - s))"; }
          export YARD_API_PREBUILT=1 YARD_WEB_PREVIEW=1 YARD_RENDER=1
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$RAW/browser-sqlite.json" PLAYWRIGHT_JSON_OUTPUT_NAME="$RAW/browser-sqlite.json"
          read code s < <(t bash -c 'npx playwright test --shard="$SHARD/2" --workers=2 --retries=1 --reporter=list,json > "$RAW/browser-sqlite.txt" 2>&1')
          echo "browser=$code" >> "$r"; echo "browser_s=$s" >> "$r"
          for port in 5173 5210 5220; do fuser -k "$port/tcp" 2>/dev/null || true; done
          cat "$r"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-browser-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw/
      - name: This job's verdict
        if: always()
        run: bash scripts/gate_job.sh "$RAW" browser
  # #endregion browser-job

  # #region gate-job
  # The gate itself: every check job's reports folded into gate-raw, and the verdict on them. It runs whatever the
  # check jobs did, so a job that died before it wrote its reports reads red here by name instead of leaving a
  # verdict that never ran.
  gate:
    needs: [cop, dotnet, cosmos, node, browser]
    if: always() && needs.cop.outputs.landed == 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    # The red checks and the first failing line, for the status a ready branch's lane reads.
    outputs:
      red: ${{ steps.verdict.outputs.red }}
      first: ${{ steps.verdict.outputs.first }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: raw-*
          path: ${{ runner.temp }}/jobs

      # #region the-fold
      # Each job's newest attempt only: a job re-run green replaces its red attempt, and one that was not re-run keeps
      # the attempt it ran in (at 1.0.4.122 a re-run went green and the fold took the first attempt's reports). Each
      # check job also judges its own keys and fails on a red one, so "re-run failed jobs" runs it again.
      - name: The fold
        if: always()
        env:
          # How each check job ended in this attempt: one that did not succeed is red here whatever its reports say.
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          python3 scripts/gate_fold.py "$RUNNER_TEMP/jobs" "$RUNNER_TEMP/raw" "$GITHUB_RUN_ATTEMPT" dotnet cosmos node browser-1 browser-2
      # #endregion the-fold

      # The commit every check tested, which promote.sh holds HEAD to, by hand as in the run: the cop's filled commit,
      # not the pushed one (ADR-137).
      - name: The tested commit
        if: always()
        env:
          FILLED: ${{ needs.cop.outputs.sha }}
        run: echo "$FILLED" | tee "$RAW/filled.sha"

      # The checks' own wall clock, from the run's start to here, beside gateSeconds, which promote measures to its
      # own step and so also counts the wait on CodeRabbit (ADR-098, the addendum of 1.0.5.4).
      - name: The checks' own wall clock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at) &&
            echo "checks_s=$(( $(date +%s) - $(date -d "$started" +%s) ))" > "$RAW/checks.result" || true
          cat "$RAW/checks.result" 2>/dev/null || echo "the checks' wall clock was not read"

      # Overwritten on a re-run, so the one gate-raw promote and a person promoting by hand download is this attempt's.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-raw
          path: ${{ runner.temp }}/raw/
          overwrite: true

      # #region verdict
      # Red is any pass that is not 0, except the two that the cuts above may skip, and a fold that is missing a job.
      - name: The verdict
        id: verdict
        if: always()
        run: |
          red=""
          val() { { grep -E "^$2=" "$RAW/$1" 2>/dev/null || true; } | head -n 1 | cut -d= -f2; }
          for k in prettier lint tsc vitest browser; do [ "$(val node.result $k)" = 0 ] || red="$red $k"; done
          v=$(val node.result browser_cosmos); [ "$v" = 0 ] || [ "$v" = skipped ] || red="$red browser_cosmos"
          for k in sqlproj functions server xunit live; do [ "$(val dotnet.result $k)" = 0 ] || red="$red $k"; done
          for k in format oncosmos; do v=$(val dotnet.result $k); [ "$v" = 0 ] || [ "$v" = skipped ] || red="$red $k"; done
          [ "$(val rest.result emdash)" = 0 ] || red="$red emdash"
          [ "$(val rest.result quality)" = 0 ] || red="$red quality"
          [ "$(val rest.result healoutside)" = 0 ] || red="$red healoutside"
          [ "$(val rest.result fold)" = 0 ] || red="$red fold"
          [ "$(val build.result warnings)" = 0 ] || red="$red warnings"
          # A log's tail is printed only when that log's OWN check is red. Every red run used to print the
          # last twelve lines of all seven text logs, so "All matched files use Prettier code style!" landed
          # as an ::error:: annotation, and the failure email named six checks when one had failed: a reader
          # who has to find the real failure among the green ones stops reading the email. The build's
          # warnings are red with no log of their own until here; they get their lines too.
          is_red() { case " $red " in *" $1 "*) return 0;; *) return 1;; esac; }
          lines() { while IFS= read -r line; do printf '::error::%s: %s\n' "$1" "$(printf '%s' "$line" | cut -c1-300)" | tee -a "$RAW/red.txt"; done; }
          # Written on the way out, red or green: the status job names the checks and the first failing line. A failing
          # test's line comes first when there is one, xUnit's "Failed <test>" or the browser's "1) <spec>": the fold's
          # note on the job that died prints before the test logs and names no test (ADR-137, the fail proof of 1.0.5.99).
          said() {
            local out=${GITHUB_OUTPUT:-/dev/null} first
            first=$({ grep -m1 -E 'Failed [A-Za-z]|[0-9]+\) ' "$RAW/red.txt" || sed -n 1p "$RAW/red.txt"; } 2> /dev/null | sed 's/^::error:://' | tr -s ' ' | cut -c1-90)
            echo "red=${red# }" >> "$out"
            echo "first=$first" >> "$out"
          }
          trap said EXIT
          if [ -n "$red" ]; then
            echo "::error::red:$red"
            for pair in prettier:prettier.txt lint:lint.txt tsc:tsc.txt format:format.txt sqlproj:sqlproj.txt emdash:emdash.txt quality:quality.txt healoutside:heal-outside.txt fold:fold.txt; do
              f=${pair#*:}; is_red "${pair%%:*}" || continue
              if [ -s "$RAW/$f" ]; then tail -n 12 "$RAW/$f" | lines "$f"; fi
            done
            if is_red warnings && [ -s "$RAW/build.txt" ]; then
              { grep -E ': warning ' "$RAW/build.txt" || true; } | head -n 8 | lines build.txt
            fi
            for pair in functions:functions.txt server:server.txt xunit:xunit-sqlite.txt live:xunit-live.txt oncosmos:xunit-cosmos.txt; do
              f=${pair#*:}; is_red "${pair%%:*}" || continue
              [ -f "$RAW/$f" ] || continue; { grep -E '^\s*Failed |Error Message' "$RAW/$f" || true; } | head -n 8 | lines "$f"
            done
            for pair in browser:browser-sqlite.txt browser_cosmos:browser-cosmos.txt; do
              f=${pair#*:}; is_red "${pair%%:*}" || continue
              [ -f "$RAW/$f" ] || continue; { grep -E '^\s+[0-9]+\) ' "$RAW/$f" || true; } | head -n 8 | lines "$f"
            done
            exit 1
          fi
          echo "red: nothing"
      # #endregion verdict
  # #endregion gate-job

  # #region shed-job
  # The Shed's two suites, so the tree that ships is green as a whole. On Windows, as on the laptop:
  # its path rules are written for the system they run on, and one of its cases (a drive letter is a
  # rooted path) only means something there.
  shed:
    needs: cop
    if: needs.cop.outputs.landed == 'go'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/filled
        with:
          sha: ${{ needs.cop.outputs.sha }}
          base: ${{ needs.cop.outputs.base }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/dotnet
      - name: The Shed's xUnit and node tests
        run: |
          x=0; (cd samples/theshed && dotnet test TestProject.sln -nologo -v q) || x=$?
          n=0; (cd samples/theshed && node --test tests/js/*.test.js) || n=$?
          echo "shed_xunit=$x shed_node=$n"
          if [ "$x" != 0 ] || [ "$n" != 0 ]; then echo "::error::red: The Shed (xUnit $x, node $n)"; exit 1; fi
  # #endregion shed-job

  # #region coderabbit-job
  # CodeRabbit, the last reviewer (ADR-129, CodeRabbit, one rung at a time). The machine that ships opens the
  # gate's pull request and asks for the review right after its push (scripts/gate_pr.sh); this job waits, beside
  # the gate's own checks, up to 30 minutes, for CodeRabbit's check on the commit to complete, so the review lands before main
  # moves. At Level 0 no finding holds the ship: a review that does not come inside the ceiling ships anyway with a
  # notice, and the row it writes says so. The row joins data/coderabbit-findings.json in the promote job.
  coderabbit:
    needs: cop
    if: needs.cop.outputs.landed == 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: The review, read when it completes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.cop.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/review"
          # CodeRabbit reviews the pushed commit, the ready branch's own, so that is the one it waits on; the row
          # carries the version the cop assigned.
          python3 scripts/coderabbit_review.py "$GITHUB_REF_NAME" "$GITHUB_SHA" 1800 "$RUNNER_TEMP/review/coderabbit.json" "$VERSION" ||
            echo "::notice::the CodeRabbit read failed; Level 0 ships anyway (ADR-129)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coderabbit-raw
          path: ${{ runner.temp }}/review/
          if-no-files-found: ignore
  # #endregion coderabbit-job

  # #region promote-job
  # The run's own promotion: only after the gate and The Shed are both green and CodeRabbit's review has been
  # read, and the only job that may write, to fast-forward main without force. Before it moves anything,
  # promote.sh's line-stop waits up to twenty minutes for main's own proof, CI on main and the after-roll for
  # main's commit; thirty minutes holds that wait and the promote itself (ADR-098, the addendum on the gate
  # freeing at live).
  promote:
    needs: [cop, gate, shed, coderabbit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      # Read this run and main's runs, and start CI on main for the promoted commit.
      actions: write
      # The coverage CI on main wrote for earlier versions, read into the quality history (ADR-130).
      checks: read
    outputs:
      sha: ${{ steps.promote.outputs.sha }}
      version: ${{ steps.promote.outputs.version }}
      functions: ${{ steps.promote.outputs.functions }}
      promoted: ${{ steps.promote.outputs.promoted }}
      by_push: ${{ steps.promote.outputs.by_push }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A version that changes a workflow needs Workflows write, which the run's own token never has.
          # The secret PROMOTE_TOKEN carries Contents and Workflows write, and checkout keeps it for the
          # push promote.sh makes; where the secret does not exist this is the run's own token again and
          # the script ends green with its notice (ADR-098, the addendum of 1.0.4.119).
          token: ${{ secrets.PROMOTE_TOKEN || github.token }}
      - uses: ./.github/actions/filled
        with:
          sha: ${{ needs.cop.outputs.sha }}
          base: ${{ needs.cop.outputs.base }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: gate-raw
          path: ${{ runner.temp }}/raw
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: coderabbit-raw
          path: ${{ runner.temp }}/raw
      - name: Promote
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          # Whether the secret exists, never its value: the script decides which of its three paths it is on
          # from this and prints neither.
          HAS_PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN != '' }}
          # The version the cop assigned (or read off a gate/* branch) and the commit every check tested.
          VERSION: ${{ needs.cop.outputs.version }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          seconds=$(( $(date +%s) - $(date -d "$started" +%s) ))
          bash scripts/promote.sh "$RUNNER_TEMP/raw" "$seconds" "$VERSION" "$GITHUB_RUN_ID"

      # #region the-handoff
      # What the after-roll needs, as one small artifact: a workflow_run run reads no job's outputs, and the
      # promoted commit is not the gate branch's, because promote.sh amended it. Only a promote that moved main
      # leaves it, so a run that promoted nothing starts an after-roll that ends green doing nothing.
      - name: The promoted commit, for the after-roll
        if: steps.promote.outputs.promoted == 'true'
        env:
          SHA: ${{ steps.promote.outputs.sha }}
          VERSION: ${{ steps.promote.outputs.version }}
          FUNCTIONS: ${{ steps.promote.outputs.functions }}
          BY_PUSH: ${{ steps.promote.outputs.by_push }}
        run: |
          mkdir -p "$RUNNER_TEMP/promoted"
          { echo "sha=$SHA"; echo "version=$VERSION"; echo "functions=$FUNCTIONS"; echo "by_push=$BY_PUSH"; } | tee "$RUNNER_TEMP/promoted/promoted.env"
      - uses: actions/upload-artifact@v7
        if: steps.promote.outputs.promoted == 'true'
        with:
          name: promoted
          path: ${{ runner.temp }}/promoted/
      # CI on main for the promoted commit, started the moment main moves, so it runs beside the roll and is
      # usually done before the after-roll looks. A push with PROMOTE_TOKEN started CI itself. A start that fails
      # never fails this job, because main has already moved and the deploys need this job green: the after-roll
      # starts CI when no CI run names the commit.
      - name: CI on main, for the promoted commit
        if: steps.promote.outputs.promoted == 'true' && steps.promote.outputs.by_push != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.promote.outputs.sha }}
        run: gh workflow run ci.yml --ref main -f sha="$SHA" || echo "::warning::CI on main was not started for $SHA; the after-roll starts it"
      # #endregion the-handoff
  # #endregion promote-job

  # #region said-job
  # What became of a ready branch, posted on its own commit, the one its lane pushed and watches (ADR-137): landed
  # with the version and main's commit, green with a hand promote owed, or the checks that were red and the first
  # failing line. The lane reads it there and, on anything but landed, rebases and pushes a new ready branch itself.
  # The ready branch is deleted by the after-roll, after this.
  said:
    needs: [cop, gate, promote]
    if: always() && startsWith(github.ref_name, 'ready/') && needs.cop.outputs.landed == 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: The status on the lane's commit
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTED: ${{ needs.promote.outputs.promoted }}
          PROMOTE: ${{ needs.promote.result }}
          GATE: ${{ needs.gate.result }}
          RED: ${{ needs.gate.outputs.red }}
          FIRST: ${{ needs.gate.outputs.first }}
          VERSION: ${{ needs.cop.outputs.version }}
          SHA: ${{ needs.promote.outputs.sha }}
        run: |
          if [ "$PROMOTED" = true ]; then
            bash scripts/cop_status.sh "$GITHUB_SHA" success "landed as $VERSION, main ${SHA:0:8}"
          elif [ "$PROMOTE" = success ]; then
            bash scripts/cop_status.sh "$GITHUB_SHA" pending "green as $VERSION, needs a hand promote (CLAUDE.md, Shipping)"
          elif [ "$GATE" = failure ]; then
            bash scripts/cop_status.sh "$GITHUB_SHA" failure "red gate as $VERSION: ${RED:-a check}${FIRST:+; $FIRST}"
          else
            bash scripts/cop_status.sh "$GITHUB_SHA" failure "not landed: the gate was $GATE and the promote $PROMOTE"
          fi
  # #endregion said-job

  # #region the-roll
  # A push made with the workflow's token starts no workflow, so the run calls the two deploys
  # itself, each pinned to the promoted commit. Each is handed only the secrets it reads, by name.
  #
  # Two promotions do not come here. A promote that moved nothing (a version that changes a workflow
  # with no PROMOTE_TOKEN to carry it) has nothing to roll. A promote that pushed WITH that token made
  # a push a person's credentials could have made, and such a push starts Deploy and Deploy Render on
  # its own: calling them again would put a second run in each concurrency group and roll the site
  # twice for one commit. So the push is the roll, and the after-roll run waits for the push's two runs
  # instead (ADR-098, the addendum of 1.0.4.119).
  #
  # These two are the run's last jobs, so the gate's concurrency group ends when they end and the next gate starts
  # at live. The reads after the roll are after-roll.yml's, started by this run's end.
  deploy:
    needs: promote
    if: needs.promote.outputs.promoted == 'true' && needs.promote.outputs.by_push != 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.promote.outputs.sha }}
    secrets:
      YARD_AUTH_SIGNING_KEY: ${{ secrets.YARD_AUTH_SIGNING_KEY }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    permissions:
      id-token: write
      contents: read
      packages: write

  deploy-render:
    needs: promote
    if: needs.promote.outputs.promoted == 'true' && needs.promote.outputs.by_push != 'true'
    uses: ./.github/workflows/deploy-render.yml
    with:
      sha: ${{ needs.promote.outputs.sha }}
    permissions:
      id-token: write
      contents: read
      packages: write
  # #endregion the-roll
