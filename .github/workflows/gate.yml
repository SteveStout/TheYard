name: Gate

# The ship's gate, on a GitHub runner instead of the laptop (ADR: The gate runs where the memory is).
#
# The laptop that ships has 8 GB and the suites need more than it has free with an editor open: a
# gate there waited hours for memory, and three takes timed out in specs the change did not touch.
# So the laptop now only builds the commit and pushes it to a branch named gate/<version>; this
# workflow runs every check the laptop's gate ran, in the same order, on a runner with 16 GB. Red,
# main is never touched.
#
# Green, the run promotes itself (ADR: The gate runs where the memory is, the addendum of
# 1.0.4.101): the promote job writes data/test-results.json and the README's figures from the
# gate-raw artifact, folds them into the commit and fast-forwards main, the run calls Deploy and
# Deploy Render on that commit, and the after-roll job reads both names and CI on main. A ship is
# a push of gate/<version>; no machine has to be on. The gate job itself only reads.
#
# A version that changes a workflow is the one that needs more than the run's own token. With the
# secret PROMOTE_TOKEN it pushes itself, and because a personal token's push starts the workflows
# the run's own push would not, that push is the roll and the two deploy jobs skip. With no such
# secret the promote job ends GREEN with a notice and moves nothing, and a person promotes the run
# by hand: green code never sends a failure email (ADR-098, the addendum of 1.0.4.119).
on:
  push:
    branches: ["gate/**"]

# Read the code; sign in to Azure for the Cosmos DB passes. Nothing else.
permissions:
  contents: read
  id-token: write

# One gate at a time: two would share the tests- containers on the Cosmos DB account.
concurrency:
  group: gate
  cancel-in-progress: false

jobs:
  # The checks run side by side (ADR-098, the addendum of 1.0.5.4). Until 1.0.5.3 every check ran in one job, one
  # after another, and the run was the sum of its suites; ADR-068's addendum of 1.0.3.183 worked out that two jobs
  # would bring it under ten minutes and left it unbuilt. Now four kinds of job start together: the .NET side on
  # SQLite, everything that reads the Cosmos DB account (in ONE job, because two would share the tests- containers
  # on it), the node checks, and the browser suite on SQLite in two shards. Each leaves its reports as
  # raw-<job>-<attempt>, and the gate job folds them into the one gate-raw folder promote.sh, the after-roll and the
  # Admin tab read, in the shape they read before, and turns the run red or green with the same verdict. Every check
  # still runs, on the same cuts; only the order of the waiting changed.

  # #region dotnet-job
  # The .NET side on SQLite: the build with any warning red, dotnet format, the SQL projects, the job hunt's
  # Function's suite, the machine lanes' suite and xUnit on SQLite.
  dotnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/dotnet
      - run: npm ci
      - name: What the branch changed
        run: |
          mkdir -p "$RUNNER_TEMP/raw/trx"
          echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          bash scripts/gate_cuts.sh "$RUNNER_TEMP/raw"

      # #region version-card
      # The link preview card names the version, so it is drawn here from the commit's own changelog
      # before any test reads it, and leaves in gate-raw for promote to fold into the commit with the
      # results: a ship needs no machine to draw it first (ADR-098, the addendum of 1.0.4.105). The
      # runner image's own Chrome draws it.
      - name: The version card
        run: |
          node docs/images/og.mjs
          python3 scripts/strip_c2pa.py docs/images
          cp docs/images/og.svg public/og.png "$RAW/"
          git status --short -- docs/images/og.svg public/og.png
      # #endregion version-card

      # #region build
      # Any build warning is red, as on the laptop.
      - name: dotnet build
        id: build
        run: |
          set -o pipefail
          dotnet build api/TheYard.slnx -c Debug 2>&1 | tee "$RAW/build.txt"
          warnings=$(grep -c ': warning ' "$RAW/build.txt" || true)
          echo "build warnings: $warnings"
          echo "warnings=$warnings" > "$RAW/build.result"
      # #endregion build

      # #region dotnet-side
      # The .NET side: format, the SQL project, the two other processes' suites and xUnit on SQLite.
      - name: The .NET side
        if: always()
        run: |
          r="$RAW/dotnet.result"; : > "$r"
          t() { local s=$SECONDS code=0; "$@" || code=$?; echo "$code $((SECONDS - s))"; }
          if [ "$FORMAT_NEEDED" = 1 ]; then
            read code s < <(t bash -c 'dotnet format api/TheYard.slnx --verify-no-changes --no-restore > "$RAW/format.txt" 2>&1 && dotnet format server/JobHunt.Server.slnx --verify-no-changes >> "$RAW/format.txt" 2>&1')
            echo "format=$code" >> "$r"; echo "format_s=$s" >> "$r"
          else echo "format=skipped" >> "$r"; echo "format_s=0" >> "$r"; fi
          read code s < <(t bash -c 'dotnet build api/TheYard.Database/TheYard.Database.sqlproj -c Debug > "$RAW/sqlproj.txt" 2>&1 && dotnet build functions/JobHunt.Database/JobHunt.Database.sqlproj -c Debug >> "$RAW/sqlproj.txt" 2>&1')
          echo "sqlproj=$code" >> "$r"; echo "sqlproj_s=$s" >> "$r"
          # The job hunt's Function's own suite, so a version that breaks it never reaches main.
          read code s < <(t bash -c 'dotnet test functions/jobhunt.Tests > "$RAW/functions.txt" 2>&1')
          echo "functions=$code" >> "$r"; echo "functions_s=$s" >> "$r"
          # The machine lanes' own suite, the third process (ADR-119, the addendum on the third process).
          read code s < <(t bash -c 'dotnet test server/JobHunt.Server.Tests > "$RAW/server.txt" 2>&1')
          echo "server=$code" >> "$r"; echo "server_s=$s" >> "$r"
          read code s < <(t bash -c 'dotnet test api --no-build --filter "Store!=cosmos" --logger "trx;LogFileName=xunit-sqlite.trx" --results-directory "$RAW/trx" > "$RAW/xunit-sqlite.txt" 2>&1')
          echo "xunit=$code" >> "$r"; echo "xunit_s=$s" >> "$r"
          cat "$r"
      # #endregion dotnet-side

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-dotnet-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw/
      - name: This job's verdict
        if: always()
        run: bash scripts/gate_job.sh "$RAW" warnings format sqlproj functions server xunit
  # #endregion dotnet-job

  # #region cosmos-job
  # Everything that reads the Cosmos DB account, in this one job and one pass after another: the live Cosmos DB
  # tests on every run, and, when the commit touched what they read, the whole xUnit suite booted on Cosmos DB and
  # the three store specs in the browser. The live tests, xUnit on Cosmos DB and the browser pass on Cosmos DB share
  # the account, and the last two the tests- containers on it, so they are never split across jobs. This is the one
  # job that signs in to Azure: a sign-in that times out reddens this job's passes and nothing else.
  cosmos:
    runs-on: ubuntu-24.04
    # The federated credential for the Cosmos DB passes is issued to this environment, so a
    # branch name never has to be registered in Azure.
    environment: gate
    timeout-minutes: 30
    env:
      COSMOS_ENDPOINT: https://cosmos-theyard-ss.documents.azure.com:443/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/dotnet
      - run: npm ci
      - name: What the branch changed
        run: |
          mkdir -p "$RUNNER_TEMP/raw/trx"
          echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          bash scripts/gate_cuts.sh "$RUNNER_TEMP/raw"
      # The suite booted on Cosmos DB reads the card as the SQLite pass does.
      - name: The version card, for the suite to read
        run: |
          node docs/images/og.mjs
          python3 scripts/strip_c2pa.py docs/images
      # A login that fails does not stop the run here: the live Cosmos DB tests that need it then
      # fail on their own, by name, and the verdict turns the run red.
      - uses: azure/login@v3
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The build's warnings are judged in the dotnet job; this build only has to be there for the passes.
      - name: dotnet build, for the passes
        run: dotnet build api/TheYard.slnx -c Debug > "$RAW/cosmos-build.txt" 2>&1 || { tail -n 20 "$RAW/cosmos-build.txt"; exit 1; }
      - name: The bundle and Chrome, for the store specs
        if: env.COSMOS_NEEDED == '1'
        run: |
          npx playwright install --with-deps chrome
          npx vite build

      # #region both-stores
      # The same xUnit suite again, booted on Cosmos DB: the process pointed at the account and the
      # tests- containers, when the commit touched what it reads; between the live tests that need
      # the account and the three store specs in the browser.
      - name: The Cosmos DB passes
        if: always()
        run: |
          d="$RAW/dotnet.result"; n="$RAW/node.result"; : > "$d"; : > "$n"
          t() { local s=$SECONDS code=0; "$@" || code=$?; echo "$code $((SECONDS - s))"; }
          export Cosmos__AccountEndpoint="$COSMOS_ENDPOINT"
          read code s < <(t bash -c 'dotnet test api --no-build --filter "Store=cosmos" --logger "trx;LogFileName=xunit-live.trx" --results-directory "$RAW/trx" > "$RAW/xunit-live.txt" 2>&1')
          echo "live=$code" >> "$d"; echo "live_s=$s" >> "$d"
          export Cosmos__ContainerPrefix="tests-"
          if [ "$COSMOS_NEEDED" = 1 ]; then
            read code s < <(t bash -c 'dotnet test api --no-build --filter "Store!=cosmos" --logger "trx;LogFileName=xunit-cosmos.trx" --results-directory "$RAW/trx" > "$RAW/xunit-cosmos.txt" 2>&1')
            echo "oncosmos=$code" >> "$d"; echo "oncosmos_s=$s" >> "$d"
          else echo "oncosmos=skipped" >> "$d"; echo "oncosmos_s=0" >> "$d"; fi
          export YARD_API_PREBUILT=1 YARD_WEB_PREVIEW=1
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$RAW/browser-cosmos.json" PLAYWRIGHT_JSON_OUTPUT_NAME="$RAW/browser-cosmos.json"
          if [ "$COSMOS_NEEDED" = 1 ]; then
            read code s < <(t bash -c 'npx playwright test tests/e2e/store-toggle.spec.ts tests/e2e/account.spec.ts tests/e2e/admin.spec.ts --workers=2 --retries=1 --reporter=list,json > "$RAW/browser-cosmos.txt" 2>&1')
            echo "browser_cosmos=$code" >> "$n"; echo "browser_cosmos_s=$s" >> "$n"
          else echo "browser_cosmos=skipped" >> "$n"; echo "browser_cosmos_s=0" >> "$n"; fi
          for port in 5173 5210; do fuser -k "$port/tcp" 2>/dev/null || true; done
          cat "$d" "$n"
      # #endregion both-stores

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-cosmos-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw/
      - name: This job's verdict
        if: always()
        run: bash scripts/gate_job.sh "$RAW" live oncosmos browser_cosmos
  # #endregion cosmos-job

  # #region node-job
  # The node checks: the two bundles and the code's own numbers, Prettier, oxlint, the type check, Vitest, the em
  # dash scan and the quality ratchet.
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/dotnet
      - run: npm ci
      - run: mkdir -p "$RUNNER_TEMP/raw" && echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
      - run: npx vite build
        id: web
      - run: npx vite build --config render/vite.config.ts

      # #region code-numbers
      # The code's own numbers for CODE HEALTH on the tests card: the page's built size and the
      # packages with a newer release. Measurements, not checks: nothing here turns the run red
      # (the build's warnings already do, in the dotnet job), so they go to their own file,
      # code.result. They run only after the page's build passed: a size read off a failed build
      # would say 0 kB, and the card must say not measured instead (ADR-080).
      - name: The code's own numbers
        if: always() && steps.web.outcome == 'success'
        run: |
          echo "dist_js_bytes=$(cat dist/assets/*.js | wc -c)" >> "$RAW/code.result"
          echo "dist_css_bytes=$(cat dist/assets/*.css | wc -c)" >> "$RAW/code.result"
          npm outdated --json > "$RAW/npm-outdated.json" 2>/dev/null || true
          echo "outdated_npm=$(node -e 'try{console.log(Object.keys(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")||"{}")).length)}catch{console.log(-1)}' "$RAW/npm-outdated.json")" >> "$RAW/code.result"
          echo "outdated_nuget=$( (dotnet list api/TheYard.slnx package --outdated 2>/dev/null || true) | grep -cE '^\s+> ' || true)" >> "$RAW/code.result"
          cat "$RAW/code.result"
      # #endregion code-numbers

      # #region node-side
      # The node side: Prettier, oxlint, the type check and Vitest. The browser suite is the browser job's.
      - name: The node side
        if: always()
        run: |
          r="$RAW/node.result"; : > "$r"
          t() { local s=$SECONDS code=0; "$@" || code=$?; echo "$code $((SECONDS - s))"; }
          read code s < <(t bash -c 'npm run format:check > "$RAW/prettier.txt" 2>&1')
          echo "prettier=$code" >> "$r"; echo "prettier_s=$s" >> "$r"
          read code s < <(t bash -c 'npm run lint > "$RAW/lint.txt" 2>&1')
          echo "lint=$code" >> "$r"; echo "lint_s=$s" >> "$r"
          read code s < <(t bash -c 'npx tsc -b > "$RAW/tsc.txt" 2>&1')
          echo "tsc=$code" >> "$r"; echo "tsc_s=$s" >> "$r"
          read code s < <(t bash -c 'npx vitest run --reporter=default --reporter=json --outputFile.json="$RAW/vitest.json" > "$RAW/vitest.txt" 2>&1')
          echo "vitest=$code" >> "$r"; echo "vitest_s=$s" >> "$r"
          cat "$r"
      # #endregion node-side

      # #region em-dashes
      # The house rule on em dashes, over every text file.
      - name: The em dash scan
        if: always()
        run: |
          r="$RAW/rest.result"; : > "$r"
          hits=$( (grep -rlP '\x{2014}' --include='*.md' --include='*.cs' --include='*.ts' --include='*.tsx' --include='*.css' --include='*.yml' --include='*.yaml' --include='*.json' --include='*.sql' --include='*.sqlproj' --include='*.csproj' --include='*.slnx' --include='*.mjs' --include='*.svg' --exclude-dir=node_modules --exclude-dir=bin --exclude-dir=obj --exclude-dir=.git --exclude-dir=dist --exclude-dir=dist-render --exclude-dir=playwright-report --exclude-dir=test-results . || true) | tee "$RAW/emdash.txt" | wc -l)
          echo "emdash=$hits" >> "$r"
          cat "$r"
      # #endregion em-dashes

      # #region quality-ratchet
      # The quality ratchet, the same command CI runs, so a version cannot reach main with
      # any of its numbers worse than the file says (ADR: The numbers that may only fall).
      # It reads the checkout and builds nothing, so it costs seconds. Its result joins
      # rest.result, which the verdict reads.
      - name: The quality ratchet
        if: always()
        run: |
          r="$RAW/rest.result"
          code=0
          python3 .github/quality.py . --ratchet .github/quality-ratchet.json > "$RAW/quality.txt" 2>&1 || code=$?
          echo "quality=$code" >> "$r"
          cat "$RAW/quality.txt"
      # #endregion quality-ratchet

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-node-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw/
      - name: This job's verdict
        if: always()
        run: bash scripts/gate_job.sh "$RAW" prettier lint tsc vitest emdash quality
  # #endregion node-job

  # #region browser-job
  # The browser suite on SQLite against the bundle just built, with the rendering service in front of it, in two
  # shards that split it by spec file. The gate job folds the two shards' reports into the one result the site
  # reads, and a pass that needed its retry is still written r (ADR-068, the addendum of 1.0.4.24).
  browser:
    name: browser ${{ matrix.shard }} of 2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/dotnet
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: mkdir -p "$RUNNER_TEMP/raw" && echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
      # The API and the two bundles the suite serves; the build's warnings are the dotnet job's to judge.
      - run: dotnet build api/TheYard.Api -c Debug > "$RAW/api-build.txt" 2>&1 || { tail -n 20 "$RAW/api-build.txt"; exit 1; }
      - run: npx vite build
      - run: npx vite build --config render/vite.config.ts
      - name: The browser suite on SQLite, one shard
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          r="$RAW/node.result"; : > "$r"
          t() { local s=$SECONDS code=0; "$@" || code=$?; echo "$code $((SECONDS - s))"; }
          export YARD_API_PREBUILT=1 YARD_WEB_PREVIEW=1 YARD_RENDER=1
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$RAW/browser-sqlite.json" PLAYWRIGHT_JSON_OUTPUT_NAME="$RAW/browser-sqlite.json"
          read code s < <(t bash -c 'npx playwright test --shard="$SHARD/2" --workers=2 --retries=1 --reporter=list,json > "$RAW/browser-sqlite.txt" 2>&1')
          echo "browser=$code" >> "$r"; echo "browser_s=$s" >> "$r"
          for port in 5173 5210 5220; do fuser -k "$port/tcp" 2>/dev/null || true; done
          cat "$r"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-browser-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw/
      - name: This job's verdict
        if: always()
        run: bash scripts/gate_job.sh "$RAW" browser
  # #endregion browser-job

  # #region gate-job
  # The gate itself: every check job's reports folded into gate-raw, and the verdict on them. It runs whatever the
  # check jobs did, so a job that died before it wrote its reports reads red here by name instead of leaving a
  # verdict that never ran.
  gate:
    needs: [dotnet, cosmos, node, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: raw-*
          path: ${{ runner.temp }}/jobs

      # #region the-fold
      # Each job's newest attempt only: a job re-run green replaces its red attempt, and one that was not re-run keeps
      # the attempt it ran in (at 1.0.4.122 a re-run went green and the fold took the first attempt's reports). Each
      # check job also judges its own keys and fails on a red one, so "re-run failed jobs" runs it again.
      - name: The fold
        if: always()
        env:
          # How each check job ended in this attempt: one that did not succeed is red here whatever its reports say.
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          python3 scripts/gate_fold.py "$RUNNER_TEMP/jobs" "$RUNNER_TEMP/raw" "$GITHUB_RUN_ATTEMPT" dotnet cosmos node browser-1 browser-2
      # #endregion the-fold

      # The checks' own wall clock, from the run's start to here, beside gateSeconds, which promote measures to its
      # own step and so also counts the wait on CodeRabbit (ADR-098, the addendum of 1.0.5.4).
      - name: The checks' own wall clock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at) &&
            echo "checks_s=$(( $(date +%s) - $(date -d "$started" +%s) ))" > "$RAW/checks.result" || true
          cat "$RAW/checks.result" 2>/dev/null || echo "the checks' wall clock was not read"

      # Overwritten on a re-run, so the one gate-raw promote and a person promoting by hand download is this attempt's.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-raw
          path: ${{ runner.temp }}/raw/
          overwrite: true

      # #region verdict
      # Red is any pass that is not 0, except the two that the cuts above may skip, and a fold that is missing a job.
      - name: The verdict
        if: always()
        run: |
          red=""
          val() { { grep -E "^$2=" "$RAW/$1" 2>/dev/null || true; } | head -n 1 | cut -d= -f2; }
          for k in prettier lint tsc vitest browser; do [ "$(val node.result $k)" = 0 ] || red="$red $k"; done
          v=$(val node.result browser_cosmos); [ "$v" = 0 ] || [ "$v" = skipped ] || red="$red browser_cosmos"
          for k in sqlproj functions server xunit live; do [ "$(val dotnet.result $k)" = 0 ] || red="$red $k"; done
          for k in format oncosmos; do v=$(val dotnet.result $k); [ "$v" = 0 ] || [ "$v" = skipped ] || red="$red $k"; done
          [ "$(val rest.result emdash)" = 0 ] || red="$red emdash"
          [ "$(val rest.result quality)" = 0 ] || red="$red quality"
          [ "$(val rest.result fold)" = 0 ] || red="$red fold"
          [ "$(val build.result warnings)" = 0 ] || red="$red warnings"
          # A log's tail is printed only when that log's OWN check is red. Every red run used to print the
          # last twelve lines of all seven text logs, so "All matched files use Prettier code style!" landed
          # as an ::error:: annotation, and the failure email named six checks when one had failed: a reader
          # who has to find the real failure among the green ones stops reading the email. The build's
          # warnings are red with no log of their own until here; they get their lines too.
          is_red() { case " $red " in *" $1 "*) return 0;; *) return 1;; esac; }
          lines() { while IFS= read -r line; do printf '::error::%s: %s\n' "$1" "$(printf '%s' "$line" | cut -c1-300)"; done; }
          if [ -n "$red" ]; then
            echo "::error::red:$red"
            for pair in prettier:prettier.txt lint:lint.txt tsc:tsc.txt format:format.txt sqlproj:sqlproj.txt emdash:emdash.txt quality:quality.txt fold:fold.txt; do
              f=${pair#*:}; is_red "${pair%%:*}" || continue
              if [ -s "$RAW/$f" ]; then tail -n 12 "$RAW/$f" | lines "$f"; fi
            done
            if is_red warnings && [ -s "$RAW/build.txt" ]; then
              { grep -E ': warning ' "$RAW/build.txt" || true; } | head -n 8 | lines build.txt
            fi
            for pair in functions:functions.txt server:server.txt xunit:xunit-sqlite.txt live:xunit-live.txt oncosmos:xunit-cosmos.txt; do
              f=${pair#*:}; is_red "${pair%%:*}" || continue
              [ -f "$RAW/$f" ] || continue; { grep -E '^\s*Failed |Error Message' "$RAW/$f" || true; } | head -n 8 | lines "$f"
            done
            for pair in browser:browser-sqlite.txt browser_cosmos:browser-cosmos.txt; do
              f=${pair#*:}; is_red "${pair%%:*}" || continue
              [ -f "$RAW/$f" ] || continue; { grep -E '^\s+[0-9]+\) ' "$RAW/$f" || true; } | head -n 8 | lines "$f"
            done
            exit 1
          fi
          echo "red: nothing"
      # #endregion verdict
  # #endregion gate-job

  # #region shed-job
  # The Shed's two suites, so the tree that ships is green as a whole. On Windows, as on the laptop:
  # its path rules are written for the system they run on, and one of its cases (a drive letter is a
  # rooted path) only means something there.
  shed:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/dotnet
      - name: The Shed's xUnit and node tests
        run: |
          x=0; (cd samples/theshed && dotnet test TestProject.sln -nologo -v q) || x=$?
          n=0; (cd samples/theshed && node --test tests/js/*.test.js) || n=$?
          echo "shed_xunit=$x shed_node=$n"
          if [ "$x" != 0 ] || [ "$n" != 0 ]; then echo "::error::red: The Shed (xUnit $x, node $n)"; exit 1; fi
  # #endregion shed-job

  # #region coderabbit-job
  # CodeRabbit, the last reviewer (ADR-129, CodeRabbit, one rung at a time). The machine that ships opens the
  # gate's pull request and asks for the review right after its push (scripts/gate_pr.sh); this job waits, beside
  # the gate's own checks, up to 30 minutes, for CodeRabbit's check on the commit to complete, so the review lands before main
  # moves. At Level 0 no finding holds the ship: a review that does not come inside the ceiling ships anyway with a
  # notice, and the row it writes says so. The row joins data/coderabbit-findings.json in the promote job.
  coderabbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: The review, read when it completes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/review"
          python3 scripts/coderabbit_review.py "$GITHUB_REF_NAME" "$GITHUB_SHA" 1800 "$RUNNER_TEMP/review/coderabbit.json" ||
            echo "::notice::the CodeRabbit read failed; Level 0 ships anyway (ADR-129)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coderabbit-raw
          path: ${{ runner.temp }}/review/
          if-no-files-found: ignore
  # #endregion coderabbit-job

  # #region promote-job
  # The run's own promotion: only after the gate and The Shed are both green and CodeRabbit's review has been
  # read, and the only job that may write, to fast-forward main without force.
  promote:
    needs: [gate, shed, coderabbit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      # The coverage CI on main wrote for earlier versions, read into the quality history (ADR-130).
      checks: read
    outputs:
      sha: ${{ steps.promote.outputs.sha }}
      version: ${{ steps.promote.outputs.version }}
      functions: ${{ steps.promote.outputs.functions }}
      promoted: ${{ steps.promote.outputs.promoted }}
      by_push: ${{ steps.promote.outputs.by_push }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A version that changes a workflow needs Workflows write, which the run's own token never has.
          # The secret PROMOTE_TOKEN carries Contents and Workflows write, and checkout keeps it for the
          # push promote.sh makes; where the secret does not exist this is the run's own token again and
          # the script ends green with its notice (ADR-098, the addendum of 1.0.4.119).
          token: ${{ secrets.PROMOTE_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: gate-raw
          path: ${{ runner.temp }}/raw
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: coderabbit-raw
          path: ${{ runner.temp }}/raw
      - name: Promote
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          # Whether the secret exists, never its value: the script decides which of its three paths it is on
          # from this and prints neither.
          HAS_PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN != '' }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          seconds=$(( $(date +%s) - $(date -d "$started" +%s) ))
          bash scripts/promote.sh "$RUNNER_TEMP/raw" "$seconds" "${GITHUB_REF_NAME#gate/}" "$GITHUB_RUN_ID"
  # #endregion promote-job

  # #region the-roll
  # A push made with the workflow's token starts no workflow, so the run calls the two deploys
  # itself, each pinned to the promoted commit. Each is handed only the secrets it reads, by name.
  #
  # Two promotions do not come here. A promote that moved nothing (a version that changes a workflow
  # with no PROMOTE_TOKEN to carry it) has nothing to roll. A promote that pushed WITH that token made
  # a push a person's credentials could have made, and such a push starts Deploy and Deploy Render on
  # its own: calling them again would put a second run in each concurrency group and roll the site
  # twice for one commit. So the push is the roll, and after-roll waits for the push's two runs
  # instead (ADR-098, the addendum of 1.0.4.119).
  deploy:
    needs: promote
    if: needs.promote.outputs.promoted == 'true' && needs.promote.outputs.by_push != 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.promote.outputs.sha }}
    secrets:
      YARD_AUTH_SIGNING_KEY: ${{ secrets.YARD_AUTH_SIGNING_KEY }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    permissions:
      id-token: write
      contents: read
      packages: write

  deploy-render:
    needs: promote
    if: needs.promote.outputs.promoted == 'true' && needs.promote.outputs.by_push != 'true'
    uses: ./.github/workflows/deploy-render.yml
    with:
      sha: ${{ needs.promote.outputs.sha }}
    permissions:
      id-token: write
      contents: read
      packages: write
  # #endregion the-roll

  # #region after-roll
  # The reads after the roll, both names; then CI on main, started by hand (the one start the
  # token may make) and read to its end; then the gate branch goes.
  after-roll:
    needs: [promote, deploy, deploy-render]
    if: always() && needs.promote.result == 'success' && needs.promote.outputs.promoted == 'true' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' && needs.deploy-render.result != 'failure' && needs.deploy-render.result != 'cancelled'
    runs-on: ubuntu-24.04
    # The reads after the roll take up to thirty-three minutes, CI's start five, and CI its own length.
    timeout-minutes: 75
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.promote.outputs.sha }}
      # When the promote pushed with PROMOTE_TOKEN the push started Deploy and Deploy Render itself, so this
      # job waits for those two runs where it would otherwise have called them: the reads below must not read
      # the version before it is rolled. The commit is this version's and no other run's, so the runs are
      # found by their head commit (ADR-098, the addendum of 1.0.4.119).
      - name: The roll the push started
        if: needs.promote.outputs.by_push == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.promote.outputs.sha }}
        run: |
          for workflow in deploy.yml deploy-render.yml; do
            run=""
            for i in $(seq 1 30); do
              run=$(gh run list --workflow "$workflow" --branch main --event push --limit 10 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n 1)
              [ -n "$run" ] && break
              sleep 10
            done
            [ -n "$run" ] || { echo "::error::$workflow did not start for $SHA in five minutes"; exit 1; }
            echo "$workflow on the push: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
            gh run watch "$run" --exit-status --interval 30 > /dev/null || { echo "::error::$workflow is red for $SHA (run $run)"; exit 1; }
          done
      # The edge moves after Deploy (edge-branch.yml), which starts on a Deploy run of its own and so
      # never on the one this run called: it is started by hand on main, the promoted commit. A promote
      # that pushed with PROMOTE_TOKEN needs no start: the push's own Deploy run is a Deploy run of its
      # own, and edge-branch.yml is already watching for it.
      - name: The edge, after the deploy
        if: needs.promote.outputs.by_push != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run edge-branch.yml --ref main
      # The job hunt's Function, when the version touched it: a run of its own, so a Function that will not
      # deploy is read on its own run and never turns this one red (ADR-098, the addendum of 1.0.4.105).
      # Only while the promoted commit is still main's head: a re-run of an older run never sends the Function back.
      - name: The Function, by a run of its own
        if: needs.promote.outputs.functions == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.promote.outputs.sha }}
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$SHA" ]; then echo "::warning::$SHA is no longer main's head; the Function is not deployed from it"; exit 0; fi
          gh workflow run deploy-function.yml --ref main -f sha="$SHA"
      - name: The reads after the roll
        run: python3 scripts/admin_after_roll.py "${{ needs.promote.outputs.version }}" "${{ needs.promote.outputs.sha }}" "$RUNNER_TEMP/after-roll.log"
      - name: CI on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.promote.outputs.sha }}
          BY_PUSH: ${{ needs.promote.outputs.by_push }}
        # Only a run created after this dispatch counts, so a re-run never reads an earlier dispatch's result.
        # A promote that pushed with PROMOTE_TOKEN already started CI on that push, so its run is read instead
        # of a second one being dispatched; it is older than this step, and the head commit alone names it.
        run: |
          if [ "$BY_PUSH" = true ]; then
            event=push
            since=1970-01-01T00:00:00Z
          else
            event=workflow_dispatch
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci.yml --ref main
          fi
          run=""
          for i in $(seq 1 30); do
            sleep 10
            run=$(gh run list --workflow ci.yml --branch main --event "$event" --limit 10 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"$SHA\" and .createdAt >= \"$since\") | .databaseId" | head -n 1)
            [ -n "$run" ] && break
          done
          [ -n "$run" ] || { echo "::error::CI on main did not start for $SHA in five minutes"; exit 1; }
          echo "CI on main: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
          gh run watch "$run" --exit-status --interval 30 > /dev/null || { echo "::error::CI on main is red for $SHA (run $run)"; exit 1; }
          echo "CI on main: success (run $run)"
      # The gate's pull request closes on main's commit before its branch goes: promote.sh amended the commit the
      # request carries, so GitHub never marks it merged (ADR-129).
      - name: The pull request closes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gate_pr.sh close "${{ needs.promote.outputs.version }}" "${{ needs.promote.outputs.sha }}" || echo "::warning::the pull request for $GITHUB_REF_NAME was not closed"
      - name: The gate branch goes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || echo "::warning::the gate branch $GITHUB_REF_NAME was not deleted"
  # #endregion after-roll
