name: Gate

# The ship's gate, on a GitHub runner instead of the laptop (ADR: The gate runs where the memory is).
#
# The laptop that ships has 8 GB and the suites need more than it has free with an editor open: a
# gate there waited hours for memory, and three takes timed out in specs the change did not touch.
# So the laptop now only builds the commit and pushes it to a branch named gate/<version>; this
# workflow runs every check the laptop's gate ran, in the same order, on a runner with 16 GB. Red,
# main is never touched.
#
# Green, the run promotes itself (ADR: The gate runs where the memory is, the addendum of
# 1.0.4.101): the promote job writes data/test-results.json and the README's figures from the
# gate-raw artifact, folds them into the commit and fast-forwards main, the run calls Deploy and
# Deploy Render on that commit, and the after-roll job reads both names and CI on main. A ship is
# a push of gate/<version>; no machine has to be on. The gate job itself only reads.
on:
  push:
    branches: ["gate/**"]

# Read the code; sign in to Azure for the Cosmos DB passes. Nothing else.
permissions:
  contents: read
  id-token: write

# One gate at a time: two would share the tests- containers on the Cosmos DB account.
concurrency:
  group: gate
  cancel-in-progress: false

jobs:
  # #region gate-job
  gate:
    runs-on: ubuntu-24.04
    # The federated credential for the Cosmos DB passes is issued to this environment, so a
    # branch name never has to be registered in Azure.
    environment: gate
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/dotnet
      - run: npm ci
      - run: npx playwright install --with-deps chrome

      # #region two-cuts
      # What the branch changed decides two things, as on the laptop (ADR: The five-minute gate, the
      # addendum on the two cuts): whether dotnet format runs, and whether the two passes on Cosmos DB
      # run or are carried forward from the last version that ran them. The diff is from where the
      # branch left main, so every commit it would ship is read, however many there are.
      - name: What the branch changed
        run: |
          mkdir -p "$RUNNER_TEMP/raw/trx" "$RUNNER_TEMP/raw/trx-shed"
          echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          git diff --name-only "$(git merge-base origin/main HEAD)" HEAD > "$RUNNER_TEMP/raw/touched.txt"
          cat "$RUNNER_TEMP/raw/touched.txt"
          if grep -qE '\.(cs|csproj|slnx|editorconfig)$' "$RUNNER_TEMP/raw/touched.txt"; then echo "FORMAT_NEEDED=1" >> "$GITHUB_ENV"; else echo "FORMAT_NEEDED=0" >> "$GITHUB_ENV"; fi
          if grep -qE '^(api/|infra/cosmos/|tests/e2e/(store-toggle|account|admin)\.spec\.ts$)' "$RUNNER_TEMP/raw/touched.txt"; then echo "COSMOS_NEEDED=1" >> "$GITHUB_ENV"; else echo "COSMOS_NEEDED=0" >> "$GITHUB_ENV"; fi
      # #endregion two-cuts

      # #region version-card
      # The link preview card names the version, so it is drawn here from the commit's own changelog
      # before any test reads it, and leaves in gate-raw for promote to fold into the commit with the
      # results: a ship needs no machine to draw it first (ADR-098, the addendum of 1.0.4.105).
      - name: The version card
        run: |
          node docs/images/og.mjs
          python3 scripts/strip_c2pa.py docs/images
          cp docs/images/og.svg public/og.png "$RAW/"
          git status --short -- docs/images/og.svg public/og.png
      # #endregion version-card

      # A login that fails does not stop the run here: the live Cosmos DB tests that need it then
      # fail on their own, by name, and the verdict below turns the run red.
      - uses: azure/login@v3
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # #region build
      # Any build warning is red, as on the laptop.
      - name: dotnet build
        id: build
        run: |
          set -o pipefail
          dotnet build api/TheYard.slnx -c Debug 2>&1 | tee "$RAW/build.txt"
          warnings=$(grep -c ': warning ' "$RAW/build.txt" || true)
          echo "build warnings: $warnings"
          echo "warnings=$warnings" > "$RAW/build.result"
      - run: npx vite build
        id: web
      - run: npx vite build --config render/vite.config.ts
      # #endregion build

      # #region code-numbers
      # The code's own numbers for CODE HEALTH on the tests card: the page's built size and the
      # packages with a newer release. Measurements, not checks: nothing here turns the run red
      # (the build's warnings already do, above), so they go to their own file, code.result. They
      # run only after the two builds they read passed, the API's and the page's (the rendering
      # service's build is not measured): a size read off a failed build would say 0 kB, and the
      # card must say not measured instead (ADR-080).
      - name: The code's own numbers
        if: always() && steps.build.outcome == 'success' && steps.web.outcome == 'success'
        run: |
          echo "dist_js_bytes=$(cat dist/assets/*.js | wc -c)" >> "$RAW/code.result"
          echo "dist_css_bytes=$(cat dist/assets/*.css | wc -c)" >> "$RAW/code.result"
          npm outdated --json > "$RAW/npm-outdated.json" 2>/dev/null || true
          echo "outdated_npm=$(node -e 'try{console.log(Object.keys(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")||"{}")).length)}catch{console.log(-1)}' "$RAW/npm-outdated.json")" >> "$RAW/code.result"
          echo "outdated_nuget=$( (dotnet list api/TheYard.slnx package --outdated 2>/dev/null || true) | grep -cE '^\s+> ' || true)" >> "$RAW/code.result"
          cat "$RAW/code.result"
      # #endregion code-numbers

      # #region dotnet-side
      # The .NET side: format, the SQL project, xUnit on SQLite, the live Cosmos DB tests, and the
      # whole suite booted on Cosmos DB when the commit touched what it reads.
      - name: The .NET side
        if: always()
        env:
          COSMOS_ENDPOINT: https://cosmos-theyard-ss.documents.azure.com:443/
        run: |
          r="$RAW/dotnet.result"; : > "$r"
          t() { local s=$SECONDS code=0; "$@" || code=$?; echo "$code $((SECONDS - s))"; }
          if [ "$FORMAT_NEEDED" = 1 ]; then
            read code s < <(t bash -c 'dotnet format api/TheYard.slnx --verify-no-changes --no-restore > "$RAW/format.txt" 2>&1')
            echo "format=$code" >> "$r"; echo "format_s=$s" >> "$r"
          else echo "format=skipped" >> "$r"; echo "format_s=0" >> "$r"; fi
          read code s < <(t bash -c 'dotnet build api/TheYard.Database/TheYard.Database.sqlproj -c Debug > "$RAW/sqlproj.txt" 2>&1 && dotnet build functions/JobHunt.Database/JobHunt.Database.sqlproj -c Debug >> "$RAW/sqlproj.txt" 2>&1')
          echo "sqlproj=$code" >> "$r"; echo "sqlproj_s=$s" >> "$r"
          # The job hunt's Function's own suite, so a version that breaks it never reaches main.
          read code s < <(t bash -c 'dotnet test functions/jobhunt.Tests > "$RAW/functions.txt" 2>&1')
          echo "functions=$code" >> "$r"; echo "functions_s=$s" >> "$r"
          # #region both-stores
          read code s < <(t bash -c 'dotnet test api --no-build --filter "Store!=cosmos" --logger "trx;LogFileName=xunit-sqlite.trx" --results-directory "$RAW/trx" > "$RAW/xunit-sqlite.txt" 2>&1')
          echo "xunit=$code" >> "$r"; echo "xunit_s=$s" >> "$r"
          export Cosmos__AccountEndpoint="$COSMOS_ENDPOINT"
          read code s < <(t bash -c 'dotnet test api --no-build --filter "Store=cosmos" --logger "trx;LogFileName=xunit-live.trx" --results-directory "$RAW/trx" > "$RAW/xunit-live.txt" 2>&1')
          echo "live=$code" >> "$r"; echo "live_s=$s" >> "$r"
          export Cosmos__ContainerPrefix="tests-"
          if [ "$COSMOS_NEEDED" = 1 ]; then
            read code s < <(t bash -c 'dotnet test api --no-build --filter "Store!=cosmos" --logger "trx;LogFileName=xunit-cosmos.trx" --results-directory "$RAW/trx" > "$RAW/xunit-cosmos.txt" 2>&1')
            echo "oncosmos=$code" >> "$r"; echo "oncosmos_s=$s" >> "$r"
          else echo "oncosmos=skipped" >> "$r"; echo "oncosmos_s=0" >> "$r"; fi
          # #endregion both-stores
          cat "$r"
      # #endregion dotnet-side

      # #region node-side
      # The node side: Prettier, oxlint, the type check, Vitest, the browser suite on SQLite against
      # the bundle just built, and the three store specs on Cosmos DB when the commit touched them.
      - name: The node side
        if: always()
        env:
          COSMOS_ENDPOINT: https://cosmos-theyard-ss.documents.azure.com:443/
        run: |
          r="$RAW/node.result"; : > "$r"
          t() { local s=$SECONDS code=0; "$@" || code=$?; echo "$code $((SECONDS - s))"; }
          read code s < <(t bash -c 'npm run format:check > "$RAW/prettier.txt" 2>&1')
          echo "prettier=$code" >> "$r"; echo "prettier_s=$s" >> "$r"
          read code s < <(t bash -c 'npm run lint > "$RAW/lint.txt" 2>&1')
          echo "lint=$code" >> "$r"; echo "lint_s=$s" >> "$r"
          read code s < <(t bash -c 'npx tsc -b > "$RAW/tsc.txt" 2>&1')
          echo "tsc=$code" >> "$r"; echo "tsc_s=$s" >> "$r"
          read code s < <(t bash -c 'npx vitest run --reporter=default --reporter=json --outputFile.json="$RAW/vitest.json" > "$RAW/vitest.txt" 2>&1')
          echo "vitest=$code" >> "$r"; echo "vitest_s=$s" >> "$r"
          export YARD_API_PREBUILT=1 YARD_WEB_PREVIEW=1 YARD_RENDER=1
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$RAW/browser-sqlite.json" PLAYWRIGHT_JSON_OUTPUT_NAME="$RAW/browser-sqlite.json"
          read code s < <(t bash -c 'npx playwright test --workers=2 --retries=1 --reporter=list,json > "$RAW/browser-sqlite.txt" 2>&1')
          echo "browser=$code" >> "$r"; echo "browser_s=$s" >> "$r"
          for port in 5173 5210 5220; do fuser -k "$port/tcp" 2>/dev/null || true; done
          sleep 3
          unset YARD_RENDER
          export Cosmos__AccountEndpoint="$COSMOS_ENDPOINT" Cosmos__ContainerPrefix="tests-"
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$RAW/browser-cosmos.json" PLAYWRIGHT_JSON_OUTPUT_NAME="$RAW/browser-cosmos.json"
          if [ "$COSMOS_NEEDED" = 1 ]; then
            read code s < <(t bash -c 'npx playwright test tests/e2e/store-toggle.spec.ts tests/e2e/account.spec.ts tests/e2e/admin.spec.ts --workers=2 --retries=1 --reporter=list,json > "$RAW/browser-cosmos.txt" 2>&1')
            echo "browser_cosmos=$code" >> "$r"; echo "browser_cosmos_s=$s" >> "$r"
          else echo "browser_cosmos=skipped" >> "$r"; echo "browser_cosmos_s=0" >> "$r"; fi
          for port in 5173 5210 5220; do fuser -k "$port/tcp" 2>/dev/null || true; done
          cat "$r"
      # #endregion node-side

      # #region em-dashes
      # The house rule on em dashes, over every text file.
      - name: The em dash scan
        if: always()
        run: |
          r="$RAW/rest.result"; : > "$r"
          hits=$( (grep -rlP '\x{2014}' --include='*.md' --include='*.cs' --include='*.ts' --include='*.tsx' --include='*.css' --include='*.yml' --include='*.yaml' --include='*.json' --include='*.sql' --include='*.sqlproj' --include='*.csproj' --include='*.slnx' --include='*.mjs' --include='*.svg' --exclude-dir=node_modules --exclude-dir=bin --exclude-dir=obj --exclude-dir=.git --exclude-dir=dist --exclude-dir=dist-render --exclude-dir=playwright-report --exclude-dir=test-results . || true) | tee "$RAW/emdash.txt" | wc -l)
          echo "emdash=$hits" >> "$r"
          cat "$r"
      # #endregion em-dashes

      # #region quality-ratchet
      # The quality ratchet, the same command CI runs, so a version cannot reach main with
      # any of its numbers worse than the file says (ADR: The numbers that may only fall).
      # It reads the checkout and builds nothing, so it costs seconds and runs whatever the
      # suites above did. Its result joins rest.result, which the verdict reads.
      - name: The quality ratchet
        if: always()
        run: |
          r="$RAW/rest.result"
          code=0
          python3 .github/quality.py . --ratchet .github/quality-ratchet.json > "$RAW/quality.txt" 2>&1 || code=$?
          echo "quality=$code" >> "$r"
          cat "$RAW/quality.txt"
      # #endregion quality-ratchet

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-raw
          path: ${{ runner.temp }}/raw/

      # #region verdict
      # Red is any pass that is not 0, except the two that the cuts above may skip.
      - name: The verdict
        if: always()
        run: |
          red=""
          val() { { grep -E "^$2=" "$RAW/$1" 2>/dev/null || true; } | head -n 1 | cut -d= -f2; }
          for k in prettier lint tsc vitest browser; do [ "$(val node.result $k)" = 0 ] || red="$red $k"; done
          v=$(val node.result browser_cosmos); [ "$v" = 0 ] || [ "$v" = skipped ] || red="$red browser_cosmos"
          for k in sqlproj functions xunit live; do [ "$(val dotnet.result $k)" = 0 ] || red="$red $k"; done
          for k in format oncosmos; do v=$(val dotnet.result $k); [ "$v" = 0 ] || [ "$v" = skipped ] || red="$red $k"; done
          [ "$(val rest.result emdash)" = 0 ] || red="$red emdash"
          [ "$(val rest.result quality)" = 0 ] || red="$red quality"
          [ "$(val build.result warnings)" = 0 ] || red="$red warnings"
          if [ -n "$red" ]; then
            echo "::error::red:$red"
            for f in prettier.txt lint.txt tsc.txt format.txt sqlproj.txt emdash.txt quality.txt; do
              if [ -s "$RAW/$f" ]; then tail -n 12 "$RAW/$f" | while IFS= read -r line; do printf '::error::%s: %s\n' "$f" "$(printf '%s' "$line" | cut -c1-300)"; done; fi
            done
            for f in functions.txt xunit-sqlite.txt xunit-live.txt xunit-cosmos.txt; do
              [ -f "$RAW/$f" ] || continue; { grep -E '^\s*Failed |Error Message' "$RAW/$f" || true; } | head -n 8 | while IFS= read -r line; do printf '::error::%s: %s\n' "$f" "$(printf '%s' "$line" | cut -c1-300)"; done
            done
            for f in browser-sqlite.txt browser-cosmos.txt; do
              [ -f "$RAW/$f" ] || continue; { grep -E '^\s+[0-9]+\) ' "$RAW/$f" || true; } | head -n 8 | while IFS= read -r line; do printf '::error::%s: %s\n' "$f" "$(printf '%s' "$line" | cut -c1-300)"; done
            done
            exit 1
          fi
          echo "red: nothing"
      # #endregion verdict
  # #endregion gate-job

  # #region shed-job
  # The Shed's two suites, so the tree that ships is green as a whole. On Windows, as on the laptop:
  # its path rules are written for the system they run on, and one of its cases (a drive letter is a
  # rooted path) only means something there.
  shed:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/dotnet
      - name: The Shed's xUnit and node tests
        run: |
          x=0; (cd samples/theshed && dotnet test TestProject.sln -nologo -v q) || x=$?
          n=0; (cd samples/theshed && node --test tests/js/*.test.js) || n=$?
          echo "shed_xunit=$x shed_node=$n"
          if [ "$x" != 0 ] || [ "$n" != 0 ]; then echo "::error::red: The Shed (xUnit $x, node $n)"; exit 1; fi
  # #endregion shed-job

  # #region promote-job
  # The run's own promotion: only after the gate and The Shed are both green, and the only job that
  # may write, to fast-forward main without force.
  promote:
    needs: [gate, shed]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.promote.outputs.sha }}
      version: ${{ steps.promote.outputs.version }}
      functions: ${{ steps.promote.outputs.functions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: gate-raw
          path: ${{ runner.temp }}/raw
      - name: Promote
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          seconds=$(( $(date +%s) - $(date -d "$started" +%s) ))
          bash scripts/promote.sh "$RUNNER_TEMP/raw" "$seconds" "${GITHUB_REF_NAME#gate/}" "$GITHUB_RUN_ID"
  # #endregion promote-job

  # #region the-roll
  # A push made with the workflow's token starts no workflow, so the run calls the two deploys
  # itself, each pinned to the promoted commit. Each is handed only the secrets it reads, by name.
  deploy:
    needs: promote
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.promote.outputs.sha }}
    secrets:
      YARD_AUTH_SIGNING_KEY: ${{ secrets.YARD_AUTH_SIGNING_KEY }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    permissions:
      id-token: write
      contents: read
      packages: write

  deploy-render:
    needs: promote
    uses: ./.github/workflows/deploy-render.yml
    with:
      sha: ${{ needs.promote.outputs.sha }}
    permissions:
      id-token: write
      contents: read
      packages: write
  # #endregion the-roll

  # #region after-roll
  # The reads after the roll, both names; then CI on main, started by hand (the one start the
  # token may make) and read to its end; then the gate branch goes.
  after-roll:
    needs: [promote, deploy, deploy-render]
    if: always() && needs.promote.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' && needs.deploy-render.result != 'failure' && needs.deploy-render.result != 'cancelled'
    runs-on: ubuntu-24.04
    # The reads after the roll take up to thirty-three minutes, CI's start five, and CI its own length.
    timeout-minutes: 75
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.promote.outputs.sha }}
      # The edge moves after Deploy (edge-branch.yml), which starts on a Deploy run of its own and so
      # never on the one this run called: it is started by hand on main, the promoted commit.
      - name: The edge, after the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run edge-branch.yml --ref main
      # The job hunt's Function, when the version touched it: a run of its own, so a Function that will not
      # deploy is read on its own run and never turns this one red (ADR-098, the addendum of 1.0.4.105).
      # Only while the promoted commit is still main's head: a re-run of an older run never sends the Function back.
      - name: The Function, by a run of its own
        if: needs.promote.outputs.functions == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.promote.outputs.sha }}
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$SHA" ]; then echo "::warning::$SHA is no longer main's head; the Function is not deployed from it"; exit 0; fi
          gh workflow run deploy-function.yml --ref main -f sha="$SHA"
      - name: The reads after the roll
        run: python3 scripts/admin_after_roll.py "${{ needs.promote.outputs.version }}" "${{ needs.promote.outputs.sha }}" "$RUNNER_TEMP/after-roll.log"
      - name: CI on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.promote.outputs.sha }}
        # Only a run created after this dispatch counts, so a re-run never reads an earlier dispatch's result.
        run: |
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --ref main
          run=""
          for i in $(seq 1 30); do
            sleep 10
            run=$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"$SHA\" and .createdAt >= \"$since\") | .databaseId" | head -n 1)
            [ -n "$run" ] && break
          done
          [ -n "$run" ] || { echo "::error::CI on main did not start for $SHA in five minutes"; exit 1; }
          echo "CI on main: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
          gh run watch "$run" --exit-status --interval 30 > /dev/null || { echo "::error::CI on main is red for $SHA (run $run)"; exit 1; }
          echo "CI on main: success (run $run)"
      - name: The gate branch goes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || echo "::warning::the gate branch $GITHUB_REF_NAME was not deleted"
  # #endregion after-roll
