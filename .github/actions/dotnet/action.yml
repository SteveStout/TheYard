# The .NET SDK that global.json names, for every job in ci.yml and gate.yml, installed so that a bad answer from the
# download does not turn a good version red (ADR-068, the addendum of 1.0.4.72). On 25 October at 14:05 CDT the gate
# for 1.0.4.72 failed in its first minute: setup-dotnet resolved 10.0.x to SDK 10.0.403 and runtime 10.0.14 and the
# download answered 409, so every check after it read red without having run. Here the install is tried twice a minute
# apart, and if both fail the runner image's own SDK is used when it satisfies global.json. The last step names the
# SDK the job builds with, and fails in one line when no SDK on the runner satisfies global.json. The version comes
# from global.json alone (ADR-098, the addendum of 1.0.5.47): asking for 10.0.x let an image that carried SDK 11.0.100
# build with it, and its CA1877 stopped the gate of 1.0.5.47.
name: .NET SDK from global.json
description: setup-dotnet for global.json's SDK, tried twice, then the runner image's own SDK if it satisfies global.json
runs:
  using: composite
  steps:
    - id: first
      uses: actions/setup-dotnet@v6
      continue-on-error: true
      with:
        global-json-file: global.json
    - if: steps.first.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::setup-dotnet failed on its first try; trying again in 60 seconds"
        sleep 60
    - id: second
      if: steps.first.outcome == 'failure'
      uses: actions/setup-dotnet@v6
      continue-on-error: true
      with:
        global-json-file: global.json
    - shell: bash
      run: |
        if ! sdk=$(dotnet --version 2>/dev/null); then
          echo "::error::no SDK on this runner satisfies global.json ($(tr -d ' \n' < global.json)); it carries: $(dotnet --list-sdks 2>/dev/null | cut -d' ' -f1 | paste -sd' ')"
          exit 1
        fi
        if [ "${{ steps.first.outcome }}" = failure ] && [ "${{ steps.second.outcome }}" = failure ]; then
          echo "::warning::the .NET download failed twice; this run builds with the runner image's own SDK $sdk"
        else
          echo "this job builds with .NET SDK $sdk, the one global.json names"
        fi
