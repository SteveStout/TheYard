# CodeRabbit, the last reviewer on every ship (ADR-129, CodeRabbit, one rung at a time).
#
# Level 0 of the ladder: the review runs on every gate's pull request and is read before main moves,
# but no finding holds a ship. Moving up a level is the owner's call on the findings log's evidence
# (data/coderabbit-findings.json), never a lane's. This file is the one place the level lives: nothing
# is set in CodeRabbit's web app, and a committed file outranks the repository's settings there.
#
# Every path instruction ends with the record that decided it, as (ADR-NNN), and CodeRabbitRuleTests
# fails when one cites no record, cites one that does not exist, or when the level below and the
# level ADR-129 names as current disagree.
# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  # #region the-level
  # Level 0: balanced feedback, no request for changes, a review that stops on an error ends neutral.
  profile: chill
  auto_approvals:
    enabled: false
  fail_commit_status: false
  # #endregion the-level
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
  # #region path-filters
  # Generated or binary: nothing a reviewer can act on.
  path_filters:
    - "!api/TheYard.Migrations.Sqlite/**/*.cs"
    - "!data/test-results.json"
    - "!data/coderabbit-findings.json"
    - "!**/package-lock.json"
    - "!docs/images/og.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.webp"
    - "!**/*.gif"
    - "!**/*.ico"
  # #endregion path-filters
  # #region path-instructions
  path_instructions:
    - path: "{api,functions,server,samples/theshed}/**/*.cs"
      instructions: >-
        Every async method in production C# takes a CancellationToken but the one framework override whose signature
        this codebase does not own. Every timer the job hunt Function runs declares the token Azure hands it and
        passes it on. Production C# only, as the ratchet's count reads it: a file in a test project (a path with
        Tests in it or a tests/ folder) and the Experiment console tool are out of scope, and so are methods named
        Main or Dispose; an async test method with no token breaks nothing. (ADR-122).
    - path: "**/*"
      instructions: >-
        Nothing this repository ships or serves contains an em dash. That is the character U+2014 in code, comments,
        documents or data, and its two HTML spellings, the named entity mdash and the numbered reference 8212; use a
        comma, a colon or two sentences. (ADR-028).
    - path: "{api/TheYard.Data,api/TheYard.Domain,api/TheYard.Application,api/TheYard.Infrastructure,api/TheYard.Infrastructure.Cosmos,api/TheYard.Api,src}/**/*.{cs,ts,tsx,css}"
      instructions: >-
        No production comment leans on a version number, a date or a review to stand in for its reason. In the
        site's own code a production comment names no month, no written date, no review by its name and no person by
        first name; a format example in quotes or backticks is not history. Production comments only: a file under a
        Migrations folder, a file whose name has .test. in it and any test project are out of scope. (ADR-074).
    - path: "functions/**/*.{cs,ts,tsx,css}"
      instructions: >-
        No production comment leans on a version number, a date or a review to stand in for its reason. In the job
        hunt's Function a comment explains by no date, no version number, no named review and nobody's ask, while
        the owner's name and a month name there are the subject the code acts on and not history. Production
        comments only: the job hunt's test project, functions/jobhunt.Tests, is out of scope. (ADR-074).
    - path: "{api/TheYard.Data,api/TheYard.Domain,api/TheYard.Application,api/TheYard.Infrastructure,api/TheYard.Infrastructure.Cosmos,api/TheYard.Api}/**/*.cs"
      instructions: >-
        Dependencies point inward: Data and Domain use nothing outside .NET's base class library, Application uses
        only Domain and Data, and the document store adapter borrows only the shared user from the relational one.
        Endpoints never reach a store or the service container, reach the auction only through Application, the host
        never queries a database itself, and services are registered only in the composition root. Domain never
        reads a file, calls the network or reads the system clock or a random number itself, and Application never
        reads a file or calls the network. Data has no behaviour (accessors, constructors and what the compiler
        writes for a record only), Data and Domain read neither the disk, the network nor the machine (a clock, a
        process, a type found by name), and an adapter neither uses the web beyond Identity nor decides on money.
        The site's six onion projects only; tests, the migrations and the Experiment tool are out of scope.
        (ADR-088).
    - path: "{api,functions}/**/{Features,Shared}/**/*.cs"
      instructions: >-
        A type under Features/<Slice>/ in Domain, Application, either adapter or the host uses only its own slice
        and the Shared concerns in any ring, never another slice's type in any ring (the host's Admin sub-slices are
        the one Admin slice to the inner rings). The job hunt Function's slices: a type under a ring's
        Features/<Slice>/ uses only its own slice and the Shared concerns in any ring, shared code uses no slice.
        The site's rings and the job hunt Function's rings; test projects are out of scope. (ADR-107).
    - path: "{api/TheYard.Application,functions/JobHunt.Application}/**/*.cs"
      instructions: >-
        Every request is a sealed `<Verb><Noun>Query` or `<Verb><Noun>Command` with exactly one handler implementing
        IQueryHandler or ICommandHandler and named for it; a query handler takes no store and no writer. A query
        handler is handed no port that can write: no constructor parameter among this codebase's types has a member,
        counting every inherited interface, whose name starts with Keep, Write, Save, Upsert, Delete, Add, Remove,
        Record, Put or Set. A use case that only reads is handed the reading half of a split port. The site's
        Application ring and the job hunt Function's; test projects are out of scope. (ADR-115).
    - path: "{api,src,render,functions,server}/**/*.{cs,ts,tsx}"
      instructions: >-
        No production C# file under `api/` and no TypeScript file under `src/` runs past 300 lines; a longer file is
        split by job and the file that keeps the name lists its parts (tests, migrations and generated files are
        left out). No C# type under `api/` runs past 300 lines either, counted across all of its partial files. The
        file rule reads api/, src/ and render/, and the job hunt's suite and the machine lanes' suite read
        functions/ and server/ the same way; the type rule reads api/ only. Out of scope: every test project
        (TheYard.Tests, jobhunt.Tests, JobHunt.Server.Tests), the SQLite migrations project, files named *.test.ts
        or *.test.tsx, and generated files (*.d.ts, *.Designer.cs, *ModelSnapshot.cs); a test file over 300 lines
        breaks nothing. (ADR-075).
  # #endregion path-instructions
